<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gastos Fiscales · Ciudad de México</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;0,900;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ============================================================
   CONFIGURACIÓN — edita solo esta parte para conectar tu Sheet
   ============================================================ */
</style>
<script>
  const CONFIG = {
    SHEET_ID: '1t44UD8juQencXipGs-aC7NocVlf3Sl_YTTytgXMzECQ',   // Ver guía, paso 4
    SHEET_NAME: '01_BASE_GASTOS',        // nombre exacto de la pestaña
    // Umbral (mdp) para marcar un cambio mensual como "relevante" en la vista de Cambios
    UMBRAL_CAMBIO_MDP: 10
  };
</script>
<style>
  :root{
    --guinda:#9D2148;
    --guinda-dark:#7A1938;
    --dorado:#B28E5C;
    --dorado-dark:#8F7147;
    --gris:#55585A;
    --crema:#FFFAE9;
    --grisclaro:#BFB7AF;
    --bg:#F7F6F3;
    --card:#FFFFFF;
    --border:#E6E1D8;
    --pos:#5B7A4E;
    --neg:#A6433C;
    --font: 'Roboto', Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--gris);font-family:var(--font);font-weight:400;}
  header{background:var(--guinda);color:#fff;padding:20px 32px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;border-bottom:4px solid var(--dorado);}
  header .brand{display:flex;flex-direction:column;}
  header h1{font-size:1.4rem;margin:0;font-weight:700;letter-spacing:.2px;}
  header .sub{font-size:.78rem;color:#F0D9C8;margin-top:3px;font-weight:300;}
  header .meta{text-align:right;font-size:.8rem;color:#F0D9C8;font-weight:300;}
  header .meta b{color:#fff;font-weight:700;}
  nav{background:var(--guinda-dark);display:flex;gap:2px;padding:0 24px;overflow-x:auto;}
  nav button{background:transparent;border:none;color:#EBC9CD;padding:12px 16px;font-size:.85rem;cursor:pointer;border-bottom:3px solid transparent;font-family:var(--font);white-space:nowrap;font-weight:500;}
  nav button.active{color:#fff;border-bottom-color:var(--dorado);font-weight:700;}
  nav button:hover{color:#fff;}
  main{max-width:1300px;margin:0 auto;padding:22px 24px 60px;}
  .view{display:none;}
  .view.active{display:block;animation:fade .2s ease;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
  select, input[type=text]{padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:.83rem;font-family:var(--font);background:#fff;color:var(--gris);}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px;}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 18px;border-top:3px solid var(--dorado);}
  .kpi .label{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--grisclaro);margin-bottom:6px;font-weight:500;}
  .kpi .value{font-size:1.55rem;font-weight:700;color:var(--guinda);}
  .kpi .delta{font-size:.76rem;margin-top:4px;color:var(--grisclaro);}
  .kpi .delta.pos{color:var(--pos);font-weight:500;}
  .kpi .delta.neg{color:var(--neg);font-weight:500;}
  .grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:16px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
  @media(max-width:850px){.grid2,.grid3{grid-template-columns:1fr;}}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;}
  .card h3{margin:0 0 3px 0;font-size:1rem;color:var(--guinda);font-weight:700;}
  .card .cap{font-size:.74rem;color:var(--grisclaro);margin-bottom:12px;}
  table{width:100%;border-collapse:collapse;font-size:.82rem;}
  th{text-align:left;color:var(--grisclaro);font-weight:500;font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);padding:7px 8px;}
  td{padding:7px 8px;border-bottom:1px solid #F1EEE7;}
  tr:hover td{background:var(--crema);}
  .barcell{background:linear-gradient(90deg, var(--dorado) var(--pct,0%), transparent var(--pct,0%));padding:2px 6px;border-radius:3px;color:#fff;font-weight:500;}
  .tag{display:inline-block;padding:2px 9px;border-radius:10px;font-size:.68rem;font-weight:700;letter-spacing:.02em;}
  .tag.sub{background:#EFE3D3;color:var(--dorado-dark);}
  .tag.red{background:#DCE7D6;color:#3E5A32;}
  .tag.con{background:#F3D9E1;color:var(--guinda-dark);}
  .tag.exe{background:#E3DCEC;color:#5A4A7A;}
  .alert{padding:10px 12px;border-left:3px solid var(--dorado);background:var(--crema);margin-bottom:8px;border-radius:0 6px 6px 0;font-size:.85rem;}
  .alert.up{border-color:var(--pos);background:#EEF3EC;}
  .alert.down{border-color:var(--neg);background:#F7ECEA;}
  .alert b{color:var(--guinda);}
  .quality-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
  .qbox{text-align:center;padding:14px 8px;background:var(--crema);border-radius:8px;}
  .qbox .n{font-size:1.3rem;font-weight:700;color:var(--guinda);}
  .qbox .l{font-size:.7rem;color:var(--gris);text-transform:uppercase;letter-spacing:.04em;margin-top:2px;}
  footer{text-align:center;padding:24px;color:var(--grisclaro);font-size:.75rem;}
  .note{font-size:.75rem;color:var(--grisclaro);margin-top:10px;font-style:italic;}
  .state-msg{padding:60px 20px;text-align:center;color:var(--grisclaro);}
  .state-msg.error{color:var(--neg);}
  .badge-ok{color:var(--pos);font-weight:700;}
  .badge-warn{color:#B98A3D;font-weight:700;}
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Gastos Fiscales · Ciudad de México</h1>
    <div class="sub">Sistema de seguimiento continuo — alimentado en vivo desde Google Sheets</div>
  </div>
  <div class="meta" id="headerMeta">Cargando…</div>
</header>

<nav id="nav"></nav>

<main id="main">
  <div class="state-msg" id="loadingMsg">Cargando información de la base…</div>
</main>

<footer>Fuente: Secretaría de Administración y Finanzas de la CDMX · Datos capturados en la base de Gastos Fiscales</footer>

<script>
// ============================================================
// 1. CARGA DE DATOS DESDE GOOGLE SHEETS (Google Visualization API)
// ============================================================
const COL = {ID:0, EJERCICIO:1, MES_NUM:2, MES:3, TIPO:4, CONCEPTO:5, ARTICULO:6, RANGO:7, AMBITO:8, BENEF:9, MONTO:10};

async function fetchSheetRows(sheetId, sheetName){
  const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('No se pudo leer la hoja (revisa que esté compartida como "Cualquier persona con el enlace - Lector").');
  const text = await res.text();
  const jsonStart = text.indexOf('{');
  const jsonEnd = text.lastIndexOf('}');
  const json = JSON.parse(text.substring(jsonStart, jsonEnd+1));
  const rawRows = json.table.rows;
  const data = [];
  // fila 0 del gviz = fila 2 del sheet (la fila 1 es encabezado, gviz la detecta sola casi siempre;
  // si no la detecta, la primera fila de datos vendría con textos de encabezado y se filtra abajo)
  rawRows.forEach(r=>{
    const c = r.c;
    const get = (i)=> c[i] ? c[i].v : null;
    const ejercicio = get(COL.EJERCICIO);
    const tipo = get(COL.TIPO);
    const concepto = get(COL.CONCEPTO);
    if(ejercicio === null || tipo === null || concepto === null) return; // fila vacía o de encabezado
    data.push({
      ejercicio: Math.round(ejercicio),
      mes_num: Math.round(get(COL.MES_NUM)),
      mes: get(COL.MES),
      tipo: String(tipo).trim(),
      concepto: String(concepto).trim(),
      articulo: get(COL.ARTICULO),
      rango: get(COL.RANGO),
      ambito: get(COL.AMBITO),
      beneficiarios: get(COL.BENEF) || 0,
      monto: get(COL.MONTO) || 0
    });
  });
  return data;
}

// ============================================================
// 2. ARRANQUE
// ============================================================
const MES_NOMBRE = ['','Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const MES_NOMBRE_LARGO = ['','Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const COLOR_TIPO = {Subsidios:'#B28E5C', Reducciones:'#5B7A4E', Condonaciones:'#9D2148', Exenciones:'#6B5A8C', Disminuciones:'#55585A'};
const TAG_CLASS = {Subsidios:'sub', Reducciones:'red', Condonaciones:'con', Exenciones:'exe', Disminuciones:'exe'};

let DATA = [];

(async function init(){
  try{
    if(CONFIG.SHEET_ID === 'PEGA_AQUI_TU_SHEET_ID'){
      showError('Falta configurar el ID de tu Google Sheet. Abre este archivo HTML con un editor de texto, busca CONFIG.SHEET_ID en la parte superior y pega el ID de tu hoja (ver guía, paso 4).');
      return;
    }
    DATA = await fetchSheetRows(CONFIG.SHEET_ID, CONFIG.SHEET_NAME);
    if(DATA.length === 0){
      showError('La hoja se leyó correctamente pero no se encontraron filas con datos. Verifica que "01_BASE_GASTOS" tenga información en las columnas B (ejercicio), E (tipo) y F (concepto).');
      return;
    }
    buildDashboard();
  }catch(err){
    showError(err.message || 'Ocurrió un error al leer la hoja de cálculo.');
  }
})();

function showError(msg){
  document.getElementById('main').innerHTML = `<div class="state-msg error"><strong>No se pudo cargar el dashboard.</strong><br><br>${msg}</div>`;
  document.getElementById('headerMeta').textContent = 'Sin conexión a datos';
}

function fmt(n, dec=1){
  return (n||0).toLocaleString('es-MX',{minimumFractionDigits:dec, maximumFractionDigits:dec});
}
function fmtInt(n){
  return Math.round(n||0).toLocaleString('es-MX');
}
function tagFor(tipo){
  return `<span class="tag ${TAG_CLASS[tipo]||''}">${tipo}</span>`;
}

// ============================================================
// 3. CONSTRUCCIÓN DEL DASHBOARD (todo calculado en vivo desde DATA)
// ============================================================
function buildDashboard(){
  const years = [...new Set(DATA.map(d=>d.ejercicio))].sort();
  const latestYear = years[years.length-1];
  const prevYear = years.length>1 ? years[years.length-2] : null;

  // último periodo con monto>0 real (para KPIs de "mes actual")
  const periodsWithData = [...new Set(DATA.filter(d=>d.monto>0).map(d=>`${d.ejercicio}-${String(d.mes_num).padStart(2,'0')}`))].sort();
  const lastPeriod = periodsWithData[periodsWithData.length-1];
  const [lastYear, lastMonthStr] = lastPeriod.split('-');
  const lastMonth = parseInt(lastMonthStr);

  document.getElementById('headerMeta').innerHTML = `Corte: <b>${MES_NOMBRE_LARGO[lastMonth]} ${lastYear}</b><br>${DATA.length.toLocaleString('es-MX')} registros en base`;

  renderNav();
  renderResumen(years, latestYear, prevYear, parseInt(lastYear), lastMonth);
  renderEvolucion(years, latestYear);
  renderDistribucion(years, latestYear);
  renderTops(years, latestYear);
  renderCambios(parseInt(lastYear), lastMonth);
  renderDetalle();
  renderCalidad();

  document.querySelectorAll('nav button')[0].click();
}

function renderNav(){
  const views = [
   ['v-resumen','Resumen ejecutivo'],
   ['v-evolucion','Evolución'],
   ['v-distribucion','Distribución'],
   ['v-tops','Tops'],
   ['v-cambios','Cambios relevantes'],
   ['v-detalle','Detalle'],
   ['v-calidad','Calidad de datos']
  ];
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  const main = document.getElementById('main');
  main.innerHTML = views.map(([id])=>`<section class="view" id="${id}"></section>`).join('');
  views.forEach(([id,label])=>{
    const b = document.createElement('button');
    b.textContent = label;
    b.onclick = ()=>{
      document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
      document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      document.getElementById(id).classList.add('active');
    };
    nav.appendChild(b);
  });
}

// ---------- helpers de agregación ----------
function sumBy(rows, keyFn){
  const m = new Map();
  rows.forEach(r=>{
    const k = keyFn(r);
    m.set(k, (m.get(k)||0) + r.monto);
  });
  return m;
}
function filterYear(year){ return DATA.filter(d=>d.ejercicio===year); }

// ---------- VISTA: RESUMEN ----------
function renderResumen(years, latestYear, prevYear, corteYear, corteMonth){
  const rowsYear = filterYear(latestYear);
  const acumulado = rowsYear.filter(r=>r.mes_num<=corteMonth || latestYear!==corteYear).reduce((s,r)=>s+r.monto,0);
  const acumuladoCorte = DATA.filter(d=>d.ejercicio===corteYear && d.mes_num<=corteMonth).reduce((s,r)=>s+r.monto,0);
  const beneficiariosCorte = DATA.filter(d=>d.ejercicio===corteYear && d.mes_num<=corteMonth).reduce((s,r)=>s+r.beneficiarios,0);

  let deltaInteranual = null;
  if(prevYear!==null){
    const acumuladoPrevMismoCorte = DATA.filter(d=>d.ejercicio===prevYear && d.mes_num<=corteMonth).reduce((s,r)=>s+r.monto,0);
    if(acumuladoPrevMismoCorte>0) deltaInteranual = (acumuladoCorte-acumuladoPrevMismoCorte)/acumuladoPrevMismoCorte;
  }

  const porConcepto = sumBy(DATA.filter(d=>d.ejercicio===corteYear && d.mes_num<=corteMonth), r=>r.tipo+' · '+r.concepto);
  const top1 = [...porConcepto.entries()].sort((a,b)=>b[1]-a[1])[0];
  const concentracion = top1 ? top1[1]/acumuladoCorte : 0;

  const monthlyByTipo = {};
  const tiposPresentes = [...new Set(DATA.filter(d=>d.ejercicio===corteYear).map(d=>d.tipo))];
  tiposPresentes.forEach(t=>{ monthlyByTipo[t] = Array(12).fill(0); });
  DATA.filter(d=>d.ejercicio===corteYear).forEach(d=>{ monthlyByTipo[d.tipo][d.mes_num-1] += d.monto; });

  const topConceptos = [...porConcepto.entries()].sort((a,b)=>b[1]-a[1]).slice(0,6);

  const el = document.getElementById('v-resumen');
  el.innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="label">Gasto fiscal acumulado ${corteYear}</div><div class="value">${fmt(acumuladoCorte)} mdp</div><div class="delta">a ${MES_NOMBRE_LARGO[corteMonth]}</div></div>
      <div class="kpi"><div class="label">Variación interanual</div><div class="value">${deltaInteranual!==null ? (deltaInteranual>=0?'+':'')+fmt(deltaInteranual*100) + '%' : 'n/d'}</div><div class="delta ${deltaInteranual>=0?'pos':'neg'}">vs. mismo corte año anterior</div></div>
      <div class="kpi"><div class="label">Beneficiarios acumulados</div><div class="value">${fmtInt(beneficiariosCorte)}</div><div class="delta">a ${MES_NOMBRE_LARGO[corteMonth]} ${corteYear}</div></div>
      <div class="kpi"><div class="label">Concentración Top 1</div><div class="value">${fmt(concentracion*100)}%</div><div class="delta">${top1?top1[0]:'—'}</div></div>
    </div>
    <div class="grid2">
      <div class="card">
        <h3>Evolución mensual por tipo de beneficio</h3>
        <div class="cap">Millones de pesos · ${corteYear}</div>
        <canvas id="chartResumen" height="150"></canvas>
      </div>
      <div class="card">
        <h3>¿Qué requiere atención?</h3>
        <div class="cap">Generado automáticamente — ver detalle en la pestaña "Cambios relevantes"</div>
        <div id="alertasResumen"></div>
      </div>
    </div>
    <div class="grid2">
      <div class="card">
        <h3>Principales conceptos</h3>
        <div class="cap">Top 6 por monto acumulado ${corteYear}</div>
        <table><thead><tr><th>Concepto</th><th style="text-align:right">Monto (mdp)</th></tr></thead>
        <tbody>${topConceptos.map(([k,v])=>{
          const [tipo,con] = k.split(' · ');
          return `<tr><td>${con} ${tagFor(tipo)}</td><td style="text-align:right">${fmt(v)}</td></tr>`;
        }).join('')}</tbody></table>
      </div>
      <div class="card">
        <h3>Distribución por tipo de beneficio</h3>
        <div class="cap">Participación sobre el acumulado ${corteYear}</div>
        <canvas id="chartDona" height="180"></canvas>
      </div>
    </div>
  `;

  new Chart(document.getElementById('chartResumen'), {
    type:'line',
    data:{ labels: MES_NOMBRE.slice(1), datasets: tiposPresentes.map(t=>({
      label:t, data: monthlyByTipo[t], borderColor: COLOR_TIPO[t]||'#999', backgroundColor:(COLOR_TIPO[t]||'#999')+'22',
      tension:.25, fill:false, pointRadius:3
    }))},
    options:{ plugins:{legend:{position:'bottom', labels:{boxWidth:10,font:{size:11,family:'Roboto'}}}},
      scales:{ y:{ ticks:{ callback:v=>v.toLocaleString('es-MX') } }, x:{ grid:{display:false} } } }
  });

  const totalPorTipo = {};
  tiposPresentes.forEach(t=> totalPorTipo[t] = monthlyByTipo[t].reduce((a,b)=>a+b,0));
  new Chart(document.getElementById('chartDona'), {
    type:'doughnut',
    data:{ labels:Object.keys(totalPorTipo), datasets:[{ data:Object.values(totalPorTipo).map(v=>+v.toFixed(1)),
      backgroundColor:Object.keys(totalPorTipo).map(t=>COLOR_TIPO[t]) }]},
    options:{ plugins:{ legend:{position:'bottom', labels:{boxWidth:10,font:{size:11,family:'Roboto'}}} } }
  });

  // alertas resumen: reusar cálculo de cambios (versión corta)
  const cambios = calcularCambios(corteYear, corteMonth);
  const alEl = document.getElementById('alertasResumen');
  if(cambios.length===0){
    alEl.innerHTML = '<div class="alert">No se detectaron variaciones mensuales por encima del umbral configurado.</div>';
  } else {
    alEl.innerHTML = cambios.slice(0,4).map(c=>{
      const cls = c.delta>=0 ? 'up' : 'down';
      const arrow = c.delta>=0 ? '▲' : '▼';
      return `<div class="alert ${cls}"><b>${c.concepto}:</b> ${arrow} ${fmt(Math.abs(c.delta))} mdp (${c.prevVal>0? (c.delta/c.prevVal*100).toFixed(0)+'%':'nuevo'}) vs. mes anterior.</div>`;
    }).join('');
  }
}

// ---------- VISTA: EVOLUCIÓN ----------
function renderEvolucion(years, defaultYear){
  const el = document.getElementById('v-evolucion');
  el.innerHTML = `
    <div class="toolbar">
      <label style="font-size:.8rem;color:var(--gris)">Ejercicio:</label>
      <select id="selEvolYear">${years.map(y=>`<option value="${y}" ${y===defaultYear?'selected':''}>${y}</option>`).join('')}</select>
    </div>
    <div class="card" style="margin-bottom:16px;">
      <h3>Evolución mensual — todos los tipos</h3>
      <div class="cap">Millones de pesos, apilado por tipo de beneficio</div>
      <canvas id="chartEvolLine" height="110"></canvas>
    </div>
    <div class="grid2">
      <div class="card">
        <h3>Acumulado progresivo</h3>
        <div class="cap">Millones de pesos, corte a cada mes</div>
        <canvas id="chartAcumulado" height="150"></canvas>
      </div>
      <div class="card">
        <h3>Comparación contra ejercicio anterior</h3>
        <div class="cap">Acumulado a la fecha vs. mismo corte del año anterior</div>
        <canvas id="chartVsAnterior" height="150"></canvas>
        <p class="note" id="notaVsAnterior"></p>
      </div>
    </div>
  `;
  document.getElementById('selEvolYear').addEventListener('change', e=> paintEvolucion(parseInt(e.target.value)));
  paintEvolucion(defaultYear);

  function paintEvolucion(year){
    const rows = filterYear(year);
    const tipos = [...new Set(rows.map(r=>r.tipo))];
    const monthly = {};
    tipos.forEach(t=> monthly[t]=Array(12).fill(0));
    rows.forEach(r=> monthly[r.tipo][r.mes_num-1]+=r.monto);

    if(window._chEvol) window._chEvol.destroy();
    window._chEvol = new Chart(document.getElementById('chartEvolLine'), {
      type:'bar',
      data:{ labels: MES_NOMBRE.slice(1), datasets: tipos.map(t=>({label:t, data:monthly[t], backgroundColor:COLOR_TIPO[t]})) },
      options:{ plugins:{legend:{position:'bottom',labels:{font:{family:'Roboto'}}}}, scales:{ x:{stacked:true, grid:{display:false}}, y:{stacked:true} } }
    });

    const totalMensual = Array(12).fill(0);
    rows.forEach(r=> totalMensual[r.mes_num-1]+=r.monto);
    let acc=0; const acumProg = totalMensual.map(v=>{acc+=v; return +acc.toFixed(1);});
    if(window._chAcum) window._chAcum.destroy();
    window._chAcum = new Chart(document.getElementById('chartAcumulado'), {
      type:'line',
      data:{ labels: MES_NOMBRE.slice(1), datasets:[{ label:'Acumulado (mdp)', data:acumProg, borderColor:'#9D2148', backgroundColor:'#9D214822', fill:true, tension:.2 }]},
      options:{ plugins:{legend:{display:false}}, scales:{x:{grid:{display:false}}} }
    });

    const prevYearRows = filterYear(year-1);
    const totalActual = totalMensual.reduce((a,b)=>a+b,0);
    const totalPrev = prevYearRows.reduce((s,r)=>s+r.monto,0);
    if(window._chVs) window._chVs.destroy();
    window._chVs = new Chart(document.getElementById('chartVsAnterior'), {
      type:'bar',
      data:{ labels:[`${year-1}`,`${year}`], datasets:[{ data:[+totalPrev.toFixed(1), +totalActual.toFixed(1)], backgroundColor:['#BFB7AF','#9D2148'] }]},
      options:{ indexAxis:'y', plugins:{legend:{display:false}} }
    });
    document.getElementById('notaVsAnterior').textContent = prevYearRows.length===0
      ? `No hay datos de ${year-1} en la base para comparar.`
      : `Comparación de totales anuales completos. Si ${year} está en curso, este total aún no es comparable 1:1 contra el año cerrado.`;
  }
}

// ---------- VISTA: DISTRIBUCIÓN ----------
function renderDistribucion(years, defaultYear){
  const el = document.getElementById('v-distribucion');
  el.innerHTML = `
    <div class="toolbar">
      <label style="font-size:.8rem;color:var(--gris)">Ejercicio:</label>
      <select id="selDistYear">${years.map(y=>`<option value="${y}" ${y===defaultYear?'selected':''}>${y}</option>`).join('')}</select>
    </div>
    <div class="grid2">
      <div class="card"><h3>Por tipo de beneficio</h3><div class="cap">Monto acumulado, mdp</div><canvas id="chartDistTipo" height="160"></canvas></div>
      <div class="card"><h3>Por concepto (Top 10)</h3><div class="cap">Monto acumulado, mdp</div><canvas id="chartDistConcepto" height="160"></canvas></div>
    </div>
  `;
  document.getElementById('selDistYear').addEventListener('change', e=> paintDist(parseInt(e.target.value)));
  paintDist(defaultYear);

  function paintDist(year){
    const rows = filterYear(year);
    const byTipo = sumBy(rows, r=>r.tipo);
    const byConcepto = sumBy(rows, r=>r.concepto);
    const topC = [...byConcepto.entries()].sort((a,b)=>b[1]-a[1]).slice(0,10);

    if(window._chDT) window._chDT.destroy();
    window._chDT = new Chart(document.getElementById('chartDistTipo'), {
      type:'bar',
      data:{ labels:[...byTipo.keys()], datasets:[{ data:[...byTipo.values()].map(v=>+v.toFixed(1)), backgroundColor:[...byTipo.keys()].map(t=>COLOR_TIPO[t]) }]},
      options:{ plugins:{legend:{display:false}} }
    });
    if(window._chDC) window._chDC.destroy();
    window._chDC = new Chart(document.getElementById('chartDistConcepto'), {
      type:'bar',
      data:{ labels:topC.map(d=>d[0]), datasets:[{ data:topC.map(d=>+d[1].toFixed(1)), backgroundColor:'#B28E5C' }]},
      options:{ indexAxis:'y', plugins:{legend:{display:false}} }
    });
  }
}

// ---------- VISTA: TOPS ----------
function renderTops(years, defaultYear){
  const el = document.getElementById('v-tops');
  el.innerHTML = `
    <div class="toolbar">
      <label style="font-size:.8rem;color:var(--gris)">Ejercicio:</label>
      <select id="selTopYear">${years.map(y=>`<option value="${y}" ${y===defaultYear?'selected':''}>${y}</option>`).join('')}</select>
    </div>
    <div class="card">
      <h3>Top 10 conceptos por monto acumulado</h3>
      <div class="cap">Calculado en vivo desde la base</div>
      <table><thead><tr><th>#</th><th>Tipo</th><th>Concepto</th><th style="text-align:right">Monto (mdp)</th><th>Participación</th></tr></thead>
      <tbody id="tbTops"></tbody></table>
    </div>
  `;
  document.getElementById('selTopYear').addEventListener('change', e=> paintTops(parseInt(e.target.value)));
  paintTops(defaultYear);

  function paintTops(year){
    const rows = filterYear(year);
    const total = rows.reduce((s,r)=>s+r.monto,0);
    const byKey = sumBy(rows, r=>r.tipo+'|'+r.concepto);
    const top10 = [...byKey.entries()].sort((a,b)=>b[1]-a[1]).slice(0,10);
    document.getElementById('tbTops').innerHTML = top10.map(([k,v],i)=>{
      const [tipo,con] = k.split('|');
      const pct = total>0 ? (v/total*100) : 0;
      return `<tr><td>${i+1}</td><td>${tagFor(tipo)}</td><td>${con}</td><td style="text-align:right">${fmt(v)}</td>
        <td><div class="barcell" style="--pct:${pct}%;">${pct.toFixed(1)}%</div></td></tr>`;
    }).join('');
  }
}

// ---------- CAMBIOS (cálculo reutilizable) ----------
function calcularCambios(year, month){
  let prevYear=year, prevMonth=month-1;
  if(prevMonth===0){ prevYear=year-1; prevMonth=12; }
  const curRows = DATA.filter(d=>d.ejercicio===year && d.mes_num===month);
  const prevRows = DATA.filter(d=>d.ejercicio===prevYear && d.mes_num===prevMonth);
  const curMap = sumBy(curRows, r=>r.tipo+' · '+r.concepto);
  const prevMap = sumBy(prevRows, r=>r.tipo+' · '+r.concepto);
  const keys = new Set([...curMap.keys(), ...prevMap.keys()]);
  const out = [];
  keys.forEach(k=>{
    const curVal = curMap.get(k)||0;
    const prevVal = prevMap.get(k)||0;
    const delta = curVal-prevVal;
    if(Math.abs(delta) >= CONFIG.UMBRAL_CAMBIO_MDP){
      out.push({concepto:k, curVal, prevVal, delta});
    }
  });
  out.sort((a,b)=> Math.abs(b.delta)-Math.abs(a.delta));
  return out;
}

// ---------- VISTA: CAMBIOS RELEVANTES ----------
function renderCambios(year, month){
  const cambios = calcularCambios(year, month);
  let prevYear=year, prevMonth=month-1;
  if(prevMonth===0){ prevYear=year-1; prevMonth=12; }
  const el = document.getElementById('v-cambios');
  el.innerHTML = `
    <div class="card">
      <h3>Cambios relevantes — ${MES_NOMBRE_LARGO[prevMonth]} ${prevYear} → ${MES_NOMBRE_LARGO[month]} ${year}</h3>
      <div class="cap">Variaciones ≥ ${CONFIG.UMBRAL_CAMBIO_MDP} mdp, calculadas automáticamente sobre el último periodo con datos</div>
      <table><thead><tr><th>Concepto</th><th style="text-align:right">${MES_NOMBRE[prevMonth]}</th><th style="text-align:right">${MES_NOMBRE[month]}</th><th style="text-align:right">Variación (mdp)</th></tr></thead>
      <tbody>${cambios.length? cambios.map(c=>{
        const [tipo,con] = c.concepto.split(' · ');
        const cls = c.delta>=0?'pos':'neg';
        return `<tr><td>${con} ${tagFor(tipo)}</td><td style="text-align:right">${fmt(c.prevVal)}</td><td style="text-align:right">${fmt(c.curVal)}</td>
          <td style="text-align:right" class="${cls}">${c.delta>=0?'+':''}${fmt(c.delta)}</td></tr>`;
      }).join('') : '<tr><td colspan="4" style="text-align:center;color:var(--grisclaro)">Sin variaciones por encima del umbral configurado.</td></tr>'}</tbody></table>
      <p class="note">Umbral configurable en CONFIG.UMBRAL_CAMBIO_MDP dentro del código del dashboard.</p>
    </div>
  `;
}

// ---------- VISTA: DETALLE ----------
function renderDetalle(){
  const el = document.getElementById('v-detalle');
  const years = [...new Set(DATA.map(d=>d.ejercicio))].sort();
  const tipos = [...new Set(DATA.map(d=>d.tipo))].sort();
  el.innerHTML = `
    <div class="card">
      <div class="toolbar">
        <select id="fYear"><option value="">Todos los ejercicios</option>${years.map(y=>`<option value="${y}">${y}</option>`).join('')}</select>
        <select id="fMes"><option value="">Todos los meses</option>${MES_NOMBRE_LARGO.slice(1).map((m,i)=>`<option value="${i+1}">${m}</option>`).join('')}</select>
        <select id="fTipo"><option value="">Todos los tipos</option>${tipos.map(t=>`<option value="${t}">${t}</option>`).join('')}</select>
        <input type="text" id="fBuscar" placeholder="Buscar concepto…">
      </div>
      <table><thead><tr><th>Ejercicio</th><th>Mes</th><th>Tipo</th><th>Concepto</th><th style="text-align:right">Beneficiarios</th><th style="text-align:right">Monto (mdp)</th></tr></thead>
      <tbody id="tbDetalle"></tbody></table>
    </div>
  `;
  const f = id=>document.getElementById(id);
  function paint(){
    const y=f('fYear').value, m=f('fMes').value, t=f('fTipo').value, q=f('fBuscar').value.toLowerCase();
    const rows = DATA.filter(d=>
      (!y || d.ejercicio===parseInt(y)) &&
      (!m || d.mes_num===parseInt(m)) &&
      (!t || d.tipo===t) &&
      (!q || d.concepto.toLowerCase().includes(q))
    ).slice(0,500);
    f('tbDetalle').innerHTML = rows.map(d=>
      `<tr><td>${d.ejercicio}</td><td>${MES_NOMBRE[d.mes_num]}</td><td>${tagFor(d.tipo)}</td><td>${d.concepto}${d.articulo?` <span style="color:var(--grisclaro)">(art. ${d.articulo})</span>`:''}</td>
       <td style="text-align:right">${fmtInt(d.beneficiarios)}</td><td style="text-align:right">${fmt(d.monto,3)}</td></tr>`
    ).join('') || '<tr><td colspan="6" style="text-align:center;color:var(--grisclaro)">Sin resultados para este filtro.</td></tr>';
  }
  ['fYear','fMes','fTipo'].forEach(id=> f(id).addEventListener('change', paint));
  f('fBuscar').addEventListener('input', paint);
  paint();
}

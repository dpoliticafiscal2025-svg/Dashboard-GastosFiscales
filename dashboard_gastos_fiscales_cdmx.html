  .state-msg{padding:60px 20px;text-align:center;color:var(--grisclaro);}

  :focus-visible{outline:3px solid var(--dorado);outline-offset:3px;}
  button,select,input,.section-index a{transition:background-color .2s ease,border-color .2s ease,color .2s ease,box-shadow .2s ease;}
  .section-heading{margin:26px 0 14px;padding:0 2px;scroll-margin-top:16px;}
  .section-heading h2{margin:0;color:var(--gris);font-size:1.2rem;letter-spacing:-.01em;}
  .section-heading p{margin:4px 0 0;color:var(--gris);font-size:.82rem;}
  .section-heading:first-child{margin-top:0;}
  .section-divider{border:0;border-top:1px solid var(--border);margin:30px 0 0;}
  .section-index{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px;}

  .data-note{background:var(--crema);border-left:3px solid var(--dorado);border-radius:0 7px 7px 0;padding:9px 12px;font-size:.8rem;margin:0 0 16px;}
  .data-note:empty{display:none;}
  .kpi .label,.kpi .delta,.card .cap,.footnote,.note{color:#686A6B;}
  .kpi,.card,.filterbar{box-shadow:0 3px 18px rgba(65,50,45,.035);}
  .kpi,.card{border-radius:12px;}
  .table-scroll{overflow-x:auto;}
  .table-scroll table{min-width:690px;}
  .pagination{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:16px;font-size:.8rem;}
  .pagination .controls{display:flex;gap:8px;align-items:center;}
  .pagination button{background:#fff;border:1px solid var(--border);border-radius:7px;padding:7px 11px;color:var(--guinda);font-family:var(--font);cursor:pointer;}
  .pagination button:disabled{opacity:.45;cursor:default;}
  .detail-muted{color:#686A6B;font-size:.76rem;}
  .multi-select{position:relative;min-width:190px;}
  .multi-select summary{list-style:none;cursor:pointer;padding:8px 12px;border:1px solid var(--border);border-radius:6px;background:#fff;font-size:.83rem;min-height:36px;}
  .multi-select summary::-webkit-details-marker{display:none;}
  .multi-select summary:after{content:"⌄";float:right;margin-left:12px;}
  .multi-options{position:absolute;z-index:10;top:calc(100% + 4px);left:0;width:min(320px,85vw);max-height:290px;overflow:auto;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 12px 28px rgba(40,30,30,.15);padding:8px;}
  .multi-options label{display:flex;align-items:center;gap:8px;padding:6px 8px;font-size:.8rem;text-transform:none;letter-spacing:normal;font-weight:400;color:var(--gris);cursor:pointer;}
  .multi-options label[hidden]{display:none;}
  .multi-options label:hover{background:var(--crema);}
  .multi-clear{width:100%;border:0;background:var(--crema);color:var(--guinda-dark);padding:7px;cursor:pointer;font:500 .8rem var(--font);border-radius:5px;}
  .chart-donut{max-width:560px;margin:0 auto;}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
  @media(max-width:650px){header{padding:18px 20px;}header .logo{width:210px;}nav{padding:0 12px;}main{padding:18px 14px 50px;}.filterbar{gap:12px;}.fb-group{flex:1 1 145px;}.fb-group select{width:100%;}.card{padding:15px;}}
  @media(prefers-reduced-motion:reduce){.view.active{animation:none;}*{scroll-behavior:auto!important;transition:none!important;}}
</style>

<header>
  <div class="brand">
    <h1>GASTOS FISCALES DE LA CIUDAD DE MÉXICO</h1>
    <div class="period" id="headerMeta">Cargando periodo…</div>
  </div>
  <img class="logo" src="https://dgtc.finanzas.cdmx.gob.mx/user/images/g5_helium/LOGO%20SAF.svg" alt="Secretaría de Administración y Finanzas de la Ciudad de México">
</header>

<nav id="nav" aria-label="Secciones principales"></nav>

<main id="main">
  <div class="state-msg" id="loadingMsg">Cargando información de la base…</div>
</main>

<footer>SECRETARÍA DE ADMINISTRACIÓN Y FINANZAS DE LA CIUDAD DE MÉXICO<br>TESORERÍA–SUBTESORERÍA DE POLÍTICA FISCAL</footer>

<script>
// ============================================================
// 1. CARGA DE DATOS DESDE GOOGLE SHEETS (Google Visualization API)
// ============================================================
const COL = {ID:0, EJERCICIO:1, MES_NUM:2, MES:3, TIPO:4, CONCEPTO:5, ARTICULO:6, RANGO:7, AMBITO:8, BENEF:9, MONTO:10, CONTRIB:11};
const MIN_COLUMNS = 12;

function finiteNumber(value){
  if(value === null || value === undefined || value === '') return null;
  const n = Number(value);
  return Number.isFinite(n) ? n : null;
}
function escapeHtml(value){
  return String(value ?? '').replace(/[&<>"']/g, char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
}

async function fetchSheetRows(sheetId, sheetName){
  const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('No se pudo leer la hoja (revisa que esté compartida como "Cualquier persona con el enlace - Lector").');
  const text = await res.text();
  const jsonStart = text.indexOf('{');
  const jsonEnd = text.lastIndexOf('}');
  if(jsonStart<0 || jsonEnd<=jsonStart) throw new Error('La hoja devolvió un formato de respuesta inesperado.');
  const json = JSON.parse(text.substring(jsonStart, jsonEnd+1));
  if(json.status !== 'ok' || !json.table || !Array.isArray(json.table.rows))
    throw new Error('Google Sheets no devolvió una tabla válida. Revisa el acceso y el nombre de la pestaña.');
  if((json.table.cols || []).length < MIN_COLUMNS)
    throw new Error('La hoja necesita las once columnas originales y la columna final de contribuyentes.');
  if([COL.EJERCICIO,COL.MES_NUM,COL.BENEF,COL.MONTO,COL.CONTRIB].some(i=>json.table.cols[i].type!=='number'))
    throw new Error('Las columnas de ejercicio, mes, beneficiarios, monto y contribuyentes deben ser numéricas.');
  const rawRows = json.table.rows;
  const data = [];
  let rejected = 0;
  rawRows.forEach(r=>{
    const c = r.c || [];
    const get = (i)=> c[i] ? c[i].v : null;
    const ejercicio = finiteNumber(get(COL.EJERCICIO));
    const mesNum = finiteNumber(get(COL.MES_NUM));
    const tipo = get(COL.TIPO);
    const concepto = get(COL.CONCEPTO);
    const monto = finiteNumber(get(COL.MONTO));
    const beneficiarios = finiteNumber(get(COL.BENEF));
    const contribuyentes = finiteNumber(get(COL.CONTRIB));
    if(!Number.isInteger(ejercicio) || !Number.isInteger(mesNum) || mesNum<1 || mesNum>12 ||
       !String(tipo ?? '').trim() || !String(concepto ?? '').trim() ||
       (get(COL.MONTO) !== null && monto === null) ||
       (get(COL.BENEF) !== null && beneficiarios === null) ||
       (get(COL.CONTRIB) !== null && contribuyentes === null)){
      rejected++;
      return;
    }
    data.push({
      id: get(COL.ID),
      ejercicio,
      mes_num: mesNum,
      mes: get(COL.MES),
      tipo: String(tipo).trim(),
      concepto: String(concepto).trim(),
      articulo: get(COL.ARTICULO),
      rango: get(COL.RANGO),
      ambito: get(COL.AMBITO),
      beneficiarios,
      contribuyentes,
      monto
    });
  });
  if(rejected) console.warn(`[Calidad] ${rejected} filas omitidas por datos estructurales inválidos.`);
  return data;
}

const MES_NOMBRE = ['','Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const MES_NOMBRE_LARGO = ['','Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const COLOR_TIPO = {Subsidios:'#B28E5C', Reducciones:'#5B7A4E', Condonaciones:'#9D2148', Exenciones:'#6B5A8C', Disminuciones:'#55585A'};
const TAG_CLASS = {Subsidios:'sub', Reducciones:'red', Condonaciones:'con', Exenciones:'exe', Disminuciones:'exe'};

let DATA = [];
let FILTERS = { year:null, periodo:'anual', mesIni:1, mesFin:12, tipo:'', conceptos:[] };
let YEAR_CUTOFF = new Map();
let resumenChart = null;
let analysisCharts = {evol:null, acum:null, vs:null, tipo:null, concepto:null};
const PAGE_SIZE = 50;

(async function init(){
  try{
    if(CONFIG.SHEET_ID === 'PEGA_AQUI_TU_SHEET_ID'){
      showError('Falta configurar el ID de tu Google Sheet. Busca CONFIG.SHEET_ID en la parte superior del código y pega el ID de tu hoja.');
      return;
    }
    DATA = await fetchSheetRows(CONFIG.SHEET_ID, CONFIG.SHEET_NAME);
    if(DATA.length === 0){
      showError('La hoja se leyó correctamente pero no se encontraron filas con datos.');
      return;
    }
    // validaciones de calidad en segundo plano (no se muestran como sección, solo en consola)
    const montoSinCaptura = DATA.filter(d=>d.monto===null).length;
    console.log(`[Calidad] Registros: ${DATA.length} · Monto sin captura: ${montoSinCaptura} · Monto reportado en cero: ${DATA.filter(d=>d.monto===0).length}`);

    const years = [...new Set(DATA.map(d=>d.ejercicio))].sort((a,b)=>a-b);
    years.forEach(year=>{
      const months = DATA.filter(d=>d.ejercicio===year && d.monto!==null).map(d=>d.mes_num);
      YEAR_CUTOFF.set(year, months.length ? Math.max(...months) : 0);
    });
    FILTERS.year = years[years.length-1];
    if(!window.Chart) throw new Error('No se pudo cargar Chart.js. Comprueba la conexión a internet e intenta nuevamente.');
    Chart.defaults.plugins.tooltip.callbacks.label = ctx=>{
      const parsed=ctx.parsed;
      const value=typeof parsed==='number' ? parsed : (ctx.chart.options.indexAxis==='y' ? parsed.x : parsed.y);
      return `${ctx.dataset.label ? ctx.dataset.label+': ' : ''}${fmt(value,1)} mdp`;
    };
    if(Chart.defaults.scales?.linear?.ticks) Chart.defaults.scales.linear.ticks.callback=value=>fmt(value,1);
    buildDashboard(years);
  }catch(err){
    showError(err.message || 'Ocurrió un error al leer la hoja de cálculo.');
  }
})();

function showError(msg){
  const main = document.getElementById('main');
  main.innerHTML = '<div class="state-msg error"><strong>No se pudo cargar el dashboard.</strong><br><br><span id="errorDetail"></span></div>';
  document.getElementById('errorDetail').textContent = msg;
  document.getElementById('headerMeta').textContent = 'Sin conexión a datos';
}

function fmt(n, dec=1){ return (n||0).toLocaleString('es-MX',{minimumFractionDigits:dec, maximumFractionDigits:dec}); }
function fmtInt(n){ return Math.round(n||0).toLocaleString('es-MX'); }
function tagFor(tipo){ return `<span class="tag ${Object.hasOwn(TAG_CLASS,tipo)?TAG_CLASS[tipo]:''}">${escapeHtml(tipo)}</span>`; }

// ============================================================
// 2. ARMADO GENERAL — Panorama continuo + Detalle independiente
// ============================================================
function buildDashboard(years){
  const periodsWithData = [...new Set(DATA.filter(d=>d.monto!==null).map(d=>`${d.ejercicio}-${String(d.mes_num).padStart(2,'0')}`))].sort();
  if(!periodsWithData.length) throw new Error('La base no contiene ningún periodo con montos o beneficiarios capturados.');
  const lastPeriod = periodsWithData[periodsWithData.length-1];
  const [lastYear, lastMonthStr] = lastPeriod.split('-');
  document.getElementById('headerMeta').textContent = `Periodo: ${MES_NOMBRE_LARGO[parseInt(lastMonthStr)]} ${lastYear}`;

  // Resumen y los tres análisis forman un recorrido continuo.
  const navViews = [['v-panorama','Panorama'], ['v-detalle','Detalle']];
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  navViews.forEach(([id,label])=>{
    const b = document.createElement('button');
    b.textContent = label;
    b.dataset.target = id;
    b.onclick = ()=>{
      document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
      document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      b.setAttribute('aria-current','page');
      nav.querySelectorAll('button').forEach(x=>{ if(x!==b) x.removeAttribute('aria-current'); });
      document.getElementById(id).classList.add('active');
      document.getElementById('filterbar').style.display = 'flex';
      window.scrollTo({top:0,behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
    };
    nav.appendChild(b);
  });

  // --- shell del main: filtros globales + panorama + detalle independiente ---
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="filterbar" id="filterbar"></div>
    <div class="view" id="v-panorama">
      <div class="section-index" aria-label="Índice del panorama">
        <a href="#v-resumen">Resumen ejecutivo</a>
        <a href="#sub-evolucion">Evolución</a>
        <a href="#sub-distribucion">Distribución</a>
        <a href="#sub-tops">Tops</a>
      </div>
      <section id="v-resumen" aria-labelledby="headingResumen"></section>
      <hr class="section-divider">
      <section id="v-analisis"></section>
    </div>
    <section class="view" id="v-detalle"></section>
  `;

  renderFilterBar(years);
  nav.querySelector('button').click();
  refreshFilteredViews();
}

// ============================================================
// 3. BARRA DE FILTROS GLOBALES (afecta Resumen + Análisis)
// ============================================================
function renderFilterBar(years){
  const tipos = [...new Set(DATA.map(d=>d.tipo))].sort();
  const conceptos = [...new Set(DATA.map(d=>d.concepto))].sort();
  const fb = document.getElementById('filterbar');
  fb.innerHTML = `
    <div class="fb-group">
      <label for="gfYear">Ejercicio</label>
      <select id="gfYear">${years.map(y=>`<option value="${y}" ${y===FILTERS.year?'selected':''}>${y}</option>`).join('')}</select>
    </div>
    <div class="fb-group">
      <label for="gfPeriodo">Periodo</label>
      <select id="gfPeriodo">
        <option value="anual">Anual</option>
        <option value="mensual">Mensual</option>
        <option value="rango">Rango de meses</option>
      </select>
    </div>
    <div class="fb-group" id="fbMesIniWrap">
      <label for="gfMesIni" id="lblMesIni">Mes inicial</label>
      <select id="gfMesIni">${MES_NOMBRE_LARGO.slice(1).map((m,i)=>`<option value="${i+1}">${m}</option>`).join('')}</select>
    </div>
    <div class="fb-group" id="fbMesFinWrap">
      <label for="gfMesFin">Mes final</label>
      <select id="gfMesFin">${MES_NOMBRE_LARGO.slice(1).map((m,i)=>`<option value="${i+1}">${m}</option>`).join('')}</select>
    </div>
    <div class="fb-group">
      <label for="gfTipo">Tipo de beneficio</label>
      <select id="gfTipo"><option value="">Todos</option>${tipos.map(t=>`<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join('')}</select>
    </div>
    <div class="fb-group">
      <label id="conceptLabel">Concepto</label>

        </div>
      </details>
    </div>
    <div class="fb-note" id="fbNote" role="status"></div>
  `;
  document.getElementById('gfMesFin').value = 12;
  applyPeriodoVisibility();

  document.getElementById('gfYear').addEventListener('change', e=>{ FILTERS.year=parseInt(e.target.value); refreshFilteredViews(); });
  document.getElementById('gfPeriodo').addEventListener('change', e=>{
    FILTERS.periodo = e.target.value;
    if(FILTERS.periodo==='anual'){ FILTERS.mesIni=1; FILTERS.mesFin=12; }
    if(FILTERS.periodo==='mensual'){ FILTERS.mesFin = FILTERS.mesIni; document.getElementById('gfMesFin').value = FILTERS.mesIni; }
    applyPeriodoVisibility();
    refreshFilteredViews();
  });
  document.getElementById('gfMesIni').addEventListener('change', e=>{
    FILTERS.mesIni = parseInt(e.target.value);
    if(FILTERS.periodo==='mensual'){ FILTERS.mesFin = FILTERS.mesIni; document.getElementById('gfMesFin').value = FILTERS.mesIni; }
    if(FILTERS.mesFin < FILTERS.mesIni){ FILTERS.mesFin = FILTERS.mesIni; document.getElementById('gfMesFin').value = FILTERS.mesIni; document.getElementById('fbNote').textContent = 'El mes final se ajustó al mes inicial.'; }
    refreshFilteredViews();
  });
  document.getElementById('gfMesFin').addEventListener('change', e=>{
    let v = parseInt(e.target.value);
    if(v < FILTERS.mesIni){
      document.getElementById('fbNote').textContent = 'El mes final no puede ser anterior al mes inicial — se ajustó automáticamente.';
      v = FILTERS.mesIni;
      e.target.value = v;
    } else {
      document.getElementById('fbNote').textContent = '';
    }
    FILTERS.mesFin = v;
    refreshFilteredViews();
  });
  document.getElementById('gfTipo').addEventListener('change', e=>{
    FILTERS.tipo=e.target.value;
    syncConceptOptions();
    refreshFilteredViews();
  });
  document.querySelectorAll('.concept-option').forEach(input=>input.addEventListener('change',()=>{
    FILTERS.conceptos=[...document.querySelectorAll('.concept-option:checked')].map(input=>input.value);
    updateConceptSummary();
    refreshFilteredViews();
  }));
  document.getElementById('clearConceptos').addEventListener('click',()=>{
    FILTERS.conceptos=[];
    document.querySelectorAll('.concept-option').forEach(input=>{input.checked=false;});
    updateConceptSummary();
    refreshFilteredViews();
  });
  document.addEventListener('click',event=>{
    const selector=document.getElementById('gfConcepto');
    if(selector?.open && !selector.contains(event.target)) selector.open=false;
  });
  syncConceptOptions();
}

function updateConceptSummary(){
  const count=FILTERS.conceptos.length;
  document.getElementById('conceptSummary').textContent = count===0 ? 'Todos los conceptos' : count===1 ? FILTERS.conceptos[0] : `${count} conceptos seleccionados`;
}

function syncConceptOptions(){
  const valid=new Set(DATA.filter(d=>!FILTERS.tipo || d.tipo===FILTERS.tipo).map(d=>d.concepto));
  FILTERS.conceptos=FILTERS.conceptos.filter(concepto=>valid.has(concepto));
  document.querySelectorAll('.concept-option').forEach(input=>{
    input.disabled=!valid.has(input.value);
    input.checked=FILTERS.conceptos.includes(input.value);
    input.closest('label').hidden=input.disabled;
  });
  updateConceptSummary();
}

function applyPeriodoVisibility(){
  const iniWrap = document.getElementById('fbMesIniWrap');
  const finWrap = document.getElementById('fbMesFinWrap');
  const lbl = document.getElementById('lblMesIni');
  if(FILTERS.periodo==='anual'){
    iniWrap.style.display='none'; finWrap.style.display='none';
  } else if(FILTERS.periodo==='mensual'){
    iniWrap.style.display='flex'; finWrap.style.display='none';
    lbl.textContent='Mes';
    document.getElementById('gfMesIni').value = FILTERS.mesIni;
  } else {
    iniWrap.style.display='flex'; finWrap.style.display='flex';
    lbl.textContent='Mes inicial';
    document.getElementById('gfMesIni').value = FILTERS.mesIni;
    document.getElementById('gfMesFin').value = FILTERS.mesFin;
  }
}

// ============================================================
// 4. HELPERS DE AGREGACIÓN SOBRE FILTROS
// ============================================================
function monthsInRange(mesIni, mesFin){
  const out=[]; for(let m=mesIni;m<=mesFin;m++) out.push(m); return out;
}
function periodBounds(){
  return FILTERS.periodo==='anual'
    ? {ini:1, fin:YEAR_CUTOFF.get(FILTERS.year)||0}
    : {ini:FILTERS.mesIni, fin:FILTERS.mesFin};
}
function getRows(year, mesIni, mesFin, tipo, conceptos){
  return DATA.filter(d=> d.ejercicio===year && d.mes_num>=mesIni && d.mes_num<=mesFin
    && (!tipo || d.tipo===tipo) && (!conceptos?.length || conceptos.includes(d.concepto)));
}
function getFilteredRows(){
  const {ini,fin}=periodBounds();
  return getRows(FILTERS.year, ini, fin, FILTERS.tipo, FILTERS.conceptos);
}
function getPrevYearRows(){
  const {ini,fin}=periodBounds();
  return getRows(FILTERS.year-1, ini, fin, FILTERS.tipo, FILTERS.conceptos);
}
function sumField(rows, field){ return rows.reduce((sum,row)=>sum+(row[field] ?? 0),0); }
function hasField(rows, field){ return rows.some(row=>row[field] !== null); }
function contribuyentesDelPeriodo(year){
  const {ini,fin}=periodBounds();
  if(ini===fin){
    const monthly=getRows(year,fin,fin,FILTERS.tipo,FILTERS.conceptos);
    return hasField(monthly,'beneficiarios') ? sumField(monthly,'beneficiarios') : null;
  }
  const terminal=getRows(year,fin,fin,FILTERS.tipo,FILTERS.conceptos);
  return hasField(terminal,'contribuyentes') ? sumField(terminal,'contribuyentes') : null;
}
function sumBy(rows, keyFn){
  const m = new Map();
  rows.filter(r=>r.monto!==null).forEach(r=>{ const k=keyFn(r); m.set(k,(m.get(k)||0)+r.monto); });
  return m;
}
function periodoLabel(){
  if(FILTERS.periodo==='anual'){
    const fin=periodBounds().fin;
    return fin===12 ? `Año completo ${FILTERS.year}` : fin>0 ? `Enero–${MES_NOMBRE_LARGO[fin]} ${FILTERS.year}` : `Sin periodo disponible para ${FILTERS.year}`;
  }
  if(FILTERS.periodo==='mensual') return `${MES_NOMBRE_LARGO[FILTERS.mesIni]} ${FILTERS.year}`;
  return `${MES_NOMBRE_LARGO[FILTERS.mesIni]}–${MES_NOMBRE_LARGO[FILTERS.mesFin]} ${FILTERS.year}`;
}
function periodoLabelPrev(){
  if(FILTERS.periodo==='anual'){
    const fin=periodBounds().fin;
    return fin===12 ? `Año completo ${FILTERS.year-1}` : fin>0 ? `Enero–${MES_NOMBRE_LARGO[fin]} ${FILTERS.year-1}` : `Sin periodo equivalente en ${FILTERS.year-1}`;
  }
  if(FILTERS.periodo==='mensual') return `${MES_NOMBRE_LARGO[FILTERS.mesIni]} ${FILTERS.year-1}`;
  return `${MES_NOMBRE_LARGO[FILTERS.mesIni]}–${MES_NOMBRE_LARGO[FILTERS.mesFin]} ${FILTERS.year-1}`;
}

// ============================================================
// 5. REFRESCO — se llama cada vez que cambia un filtro global
// ============================================================
function refreshFilteredViews(){
  const current=getFilteredRows();
  const previous=getPrevYearRows();
  renderResumen(current,previous);
  renderAnalisis(current,previous);
  renderDetalle(current);
}

// ---------- RANKING (misma lógica que Tops) con agrupación especial de Predial ----------
// Usado por "Conceptos principales" (Resumen) — limita a los 2 conceptos más relevantes.
// Cuando Tipo=Reducciones y coexisten "Predial" y "Predial (pago anticipado)", se agrupan en 1 solo renglón.
function buildRankingConAgrupacionPredial(rows){
  const byKey = sumBy(rows, r=>JSON.stringify([r.tipo,r.concepto]));
  const total = [...byKey.values()].reduce((a,b)=>a+b,0);

  const kPred = JSON.stringify(['Reducciones','Predial']);
  const kPredAnt = JSON.stringify(['Reducciones','Predial (pago anticipado)']);
  const merged = new Map(byKey);
  let didMerge = false;
  if(merged.has(kPred) && merged.has(kPredAnt)){
    const suma = merged.get(kPred) + merged.get(kPredAnt);
    merged.delete(kPred); merged.delete(kPredAnt);
    merged.set(JSON.stringify(['Reducciones','Predial¹']), suma);
    didMerge = true;
  }
  const ranked = [...merged.entries()].sort((a,b)=>b[1]-a[1]);
  return {ranked, total, didMerge};
}

// ============================================================
// 6. SECCIÓN 1 — RESUMEN EJECUTIVO
// ============================================================
function renderResumen(rows,prevRows){
  const acumulado = hasField(rows,'monto') ? sumField(rows,'monto') : null;
  const acumuladoPrev = hasField(prevRows,'monto') ? sumField(prevRows,'monto') : null;
  const beneficiarios = hasField(rows,'beneficiarios') ? sumField(rows,'beneficiarios') : null;
  const beneficiariosPrev = hasField(prevRows,'beneficiarios') ? sumField(prevRows,'beneficiarios') : null;
  const contribuyentes = contribuyentesDelPeriodo(FILTERS.year);
  const contribuyentesPrev = contribuyentesDelPeriodo(FILTERS.year-1);

  // Avance = actual/anterior*100 (sin signo, es un porcentaje de avance, no una variación)
  const avance = acumulado!==null && acumuladoPrev>0 ? (acumulado/acumuladoPrev*100) : null;
  // Variación de beneficiarios = (actual/anterior - 1)*100 (con signo)
  const varBenef = beneficiarios!==null && beneficiariosPrev>0 ? ((beneficiarios/beneficiariosPrev)-1)*100 : null;
  const varContrib = contribuyentes!==null && contribuyentesPrev>0 ? ((contribuyentes/contribuyentesPrev)-1)*100 : null;

  const {ini,fin}=periodBounds();
  const meses = monthsInRange(ini, fin);
  const tiposPresentes = [...new Set(rows.filter(d=>d.monto!==null).map(d=>d.tipo))];
  const monthlyByTipo = {};
  tiposPresentes.forEach(t=> monthlyByTipo[t] = meses.map(()=>0));
  rows.filter(d=>d.monto!==null).forEach(d=>{ const idx = meses.indexOf(d.mes_num); if(idx>=0) monthlyByTipo[d.tipo][idx]+=d.monto; });

  const {ranked, total, didMerge} = buildRankingConAgrupacionPredial(rows);
  const top2 = ranked.slice(0,2);

  const el = document.getElementById('v-resumen');
  if(resumenChart){ resumenChart.destroy(); resumenChart=null; }
  el.innerHTML = `
    <div class="section-heading"><h2 id="headingResumen">Resumen ejecutivo</h2><p>Gasto fiscal, beneficiarios y principales conceptos del periodo.</p></div>
    <div class="kpis">
      <div class="kpi"><div class="label">Gasto fiscal — ${periodoLabel()}</div><div class="value">${acumulado!==null ? fmt(acumulado)+' mdp' : 'n/d'}</div></div>
      <div class="kpi"><div class="label">Avance</div><div class="value">${avance!==null ? fmt(avance)+'%' : 'n/d'}</div><div class="delta">respecto a ${periodoLabelPrev()}</div></div>
      <div class="kpi"><div class="label">${ini===fin ? 'Beneficiarios únicos del mes' : 'Suma de beneficiarios únicos mensuales'}</div><div class="value">${beneficiarios!==null ? fmtInt(beneficiarios) : 'n/d'}</div><div class="delta">${periodoLabel()}</div></div>
      <div class="kpi"><div class="label">Variación de beneficiarios reportados</div><div class="value">${varBenef!==null ? (varBenef>=0?'+':'')+fmt(varBenef)+'%' : 'n/d'}</div><div class="delta ${varBenef!==null?(varBenef>=0?'pos':'neg'):''}">vs. ${periodoLabelPrev()}</div></div>
      <div class="kpi"><div class="label">${ini===fin ? 'Contribuyentes únicos del mes' : 'Contribuyentes únicos acumulados al periodo'}</div><div class="value">${contribuyentes!==null ? fmtInt(contribuyentes) : 'n/d'}</div><div class="delta">${ini===fin ? periodoLabel() : `Enero–${MES_NOMBRE_LARGO[fin]} ${FILTERS.year}`}</div></div>
      <div class="kpi"><div class="label">Variación de contribuyentes únicos</div><div class="value">${varContrib!==null ? (varContrib>=0?'+':'')+fmt(varContrib)+'%' : 'n/d'}</div><div class="delta ${varContrib!==null?(varContrib>=0?'pos':'neg'):''}">vs. el mismo periodo de ${FILTERS.year-1}</div></div>
    </div>
    <div class="card" style="margin-bottom:16px;">
      <h3>Evolución general</h3>
      <div class="cap">Millones de pesos · ${periodoLabel()}</div>
      ${acumulado!==null ? `<div class="${meses.length===1?'chart-donut':''}"><canvas id="chartResumen" height="130" role="img" aria-label="Evolución del gasto fiscal por tipo y mes"></canvas></div>` : '<p class="note">No hay montos capturados para esta selección.</p>'}
    </div>
    <div class="card">
      <h3>Conceptos principales</h3>
      <div class="cap">Conceptos más relevantes del periodo — ${periodoLabel()}</div>
      <table><thead><tr><th>Tipo</th><th>Concepto</th><th style="text-align:right">Monto (mdp)</th><th>Participación</th></tr></thead>
      <tbody>${top2.length ? top2.map(([k,v])=>{
        const [tipo,con] = JSON.parse(k);
        const pct = total>0 ? (v/total*100) : null;
        const pctCell = pct!==null ? `<div class="barcell"><div class="fill" style="--pct:${pct}%;"></div><div class="txt">${pct.toFixed(1)}%</div></div>` : `<span class="napct">— no aplica</span>`;
        const conLabel = con==='Predial¹' ? `Predial<sup class="ref">1</sup>` : escapeHtml(con);
        return `<tr><td>${tagFor(tipo)}</td><td>${conLabel}</td><td style="text-align:right">${fmt(v)}</td><td>${pctCell}</td></tr>`;
      }).join('') : `<tr><td colspan="4" style="text-align:center;color:var(--grisclaro)">Sin datos para este periodo y filtros.</td></tr>`}</tbody></table>
      ${didMerge ? `<p class="footnote"><sup>1</sup> Considera Predial pago anticipado.</p>` : ''}
    </div>
  `;

  if(acumulado===null) return;
  if(meses.length>1 && tiposPresentes.length>0){
    resumenChart = new Chart(document.getElementById('chartResumen'), {
      type:'line',
      data:{ labels: meses.map(m=>MES_NOMBRE[m]), datasets: tiposPresentes.map(t=>({
        label:t, data: monthlyByTipo[t].map(v=>+v.toFixed(1)), borderColor: COLOR_TIPO[t]||'#999', backgroundColor:(COLOR_TIPO[t]||'#999')+'22',
        tension:.25, fill:false, pointRadius:3
      }))},
      options:{ plugins:{legend:{position:'bottom', labels:{boxWidth:10,font:{size:11,family:'Roboto'}}}},
        scales:{ y:{ ticks:{ callback:v=>v.toLocaleString('es-MX') } }, x:{ grid:{display:false} } } }
    });
  } else {
    const totalPorTipo = {};
    tiposPresentes.forEach(t=> totalPorTipo[t] = monthlyByTipo[t].reduce((a,b)=>a+b,0));
    resumenChart = new Chart(document.getElementById('chartResumen'), {
      type:'doughnut',
      data:{ labels:Object.keys(totalPorTipo), datasets:[{ data:Object.values(totalPorTipo).map(v=>+v.toFixed(1)), backgroundColor:Object.keys(totalPorTipo).map(t=>COLOR_TIPO[t]) }]},
      options:{ plugins:{ legend:{position:'bottom', labels:{boxWidth:10,font:{size:11,family:'Roboto'}}} } }
    });
  }
}

}

function paintEvolucionAnalisis(rows,prevRows){
  const {ini,fin}=periodBounds();
  const meses = monthsInRange(ini,fin);
  const tipos = [...new Set([...rows, ...prevRows].map(d=>d.tipo))];

  const monthlyCur = {}; tipos.forEach(t=> monthlyCur[t]=meses.map(()=>0));
  rows.filter(d=>d.monto!==null).forEach(d=>{ const idx=meses.indexOf(d.mes_num); if(idx>=0) monthlyCur[d.tipo][idx]+=d.monto; });

  const totalCurByMonth = meses.map((m,i)=>hasField(rows.filter(d=>d.mes_num===m),'monto') ? tipos.reduce((s,t)=>s+monthlyCur[t][i],0) : null);
  const totalPrevByMonth = meses.map(m=>{ const monthRows=prevRows.filter(d=>d.mes_num===m); return hasField(monthRows,'monto') ? sumField(monthRows,'monto') : null; });

  let accC=0, accP=0;
  const acumCur = totalCurByMonth.map(v=>{if(v===null)return null; accC+=v; return +accC.toFixed(1);});
  const acumPrev = totalPrevByMonth.map(v=>{if(v===null)return null; accP+=v; return +accP.toFixed(1);});

  const totalCur = hasField(rows,'monto') ? sumField(rows,'monto') : null;
  const totalPrev = hasField(prevRows,'monto') ? sumField(prevRows,'monto') : null;

      <h3>Evolución mensual por tipo de beneficio</h3>

        <h3>Total del periodo — comparación</h3>

    type:'bar',
    data:{ labels: meses.map(m=>MES_NOMBRE[m]), datasets: tipos.map(t=>({label:t, data:monthlyCur[t].map((v,i)=>totalCurByMonth[i]===null?null:+v.toFixed(1)), backgroundColor:COLOR_TIPO[t]||'#55585A'})) },
    options:{ plugins:{legend:{position:'bottom',labels:{font:{family:'Roboto'}}}}, scales:{ x:{stacked:true, grid:{display:false}}, y:{stacked:true} } }

    ]},

  });

  analysisCharts.vs = new Chart(document.getElementById('chartVsAnterior'), {
    type:'bar',
    data:{ labels:[`${FILTERS.year-1}`,`${FILTERS.year}`], datasets:[{ data:[totalPrev===null?null:+totalPrev.toFixed(1), totalCur===null?null:+totalCur.toFixed(1)], backgroundColor:['#BFB7AF','#9D2148'] }]},

        <div class="card"><h3>Por concepto (Top 10)</h3><div class="cap">Monto — ${periodoLabel()}</div><canvas id="chartDistConcepto" height="160" role="img" aria-label="Diez conceptos con mayor monto"></canvas></div>

      <div class="cap">${periodoLabel()} · calculado en vivo sobre los filtros seleccionados</div>
      <table><thead><tr><th>#</th><th>Tipo</th><th>Concepto</th><th style="text-align:right">Monto (mdp)</th><th>Participación</th></tr></thead>
      <tbody>${top10.length ? top10.map(([k,v],i)=>{
        const [tipo,con] = JSON.parse(k);
        const pct = total>0 ? (v/total*100) : null;
        const pctCell = pct!==null ? `<div class="barcell"><div class="fill" style="--pct:${pct}%;"></div><div class="txt">${pct.toFixed(1)}%</div></div>` : `<span class="napct">— no aplica</span>`;
        return `<tr><td>${i+1}</td><td>${tagFor(tipo)}</td><td>${escapeHtml(con)}</td><td style="text-align:right">${fmt(v)}</td><td>${pctCell}</td></tr>`;
      }).join('') : `<tr><td colspan="5" style="text-align:center;color:var(--grisclaro)">Sin datos para este periodo y filtros.</td></tr>`}</tbody></table>
    </div>
  `;
}

// ============================================================
// 8. DETALLE — filtros independientes y paginación
// ============================================================
function renderDetalle(rows){
  const el = document.getElementById('v-detalle');
  const {ini,fin}=periodBounds();
  el.innerHTML = `
    <div class="section-heading"><h2>Detalle de registros</h2><p>${periodoLabel()} · Los filtros superiores también se aplican aquí.</p></div>
    <div class="card">
      <div class="table-scroll"><table><caption class="sr-only">Registros de gasto fiscal filtrados</caption><thead><tr><th>Ejercicio</th><th>Mes</th><th>Tipo</th><th>Concepto</th><th style="text-align:right">Beneficiarios únicos del mes</th><th style="text-align:right">${ini===fin?'Contribuyentes únicos del mes':'Contribuyentes únicos acumulados al periodo'}</th><th style="text-align:right">Monto (mdp)</th></tr></thead>
      <tbody id="tbDetalle"></tbody></table></div>
      ${ini!==fin ? `<p class="footnote">El acumulado de contribuyentes corresponde a enero–${MES_NOMBRE_LARGO[fin]} y se muestra solo en las filas del mes final.</p>` : ''}
      <div class="pagination">
        <span id="detailCount" role="status" aria-live="polite"></span>
        <div class="controls"><button id="prevPage" type="button">Anterior</button><span id="pageLabel"></span><button id="nextPage" type="button">Siguiente</button></div>
      </div>
    </div>
  `;
  const f = id=>document.getElementById(id);
  let page=1;
  function paint(){
    const pageCount=Math.max(1,Math.ceil(rows.length/PAGE_SIZE));
    page=Math.min(page,pageCount);
    const visible=rows.slice((page-1)*PAGE_SIZE,page*PAGE_SIZE);
    f('tbDetalle').innerHTML = visible.map(d=>
      `<tr><td>${d.ejercicio}</td><td>${MES_NOMBRE[d.mes_num]}</td><td>${tagFor(d.tipo)}</td><td>${escapeHtml(d.concepto)}${d.tipo==='Subsidios' && d.concepto==='Predial' && d.rango ? ' '+escapeHtml(d.rango) : ''}${d.articulo?` <span class="detail-muted">(art. ${escapeHtml(d.articulo)})</span>`:''}</td>
       <td style="text-align:right">${d.beneficiarios===null?'n/d':fmtInt(d.beneficiarios)}</td><td style="text-align:right">${ini===fin ? (d.beneficiarios===null?'n/d':fmtInt(d.beneficiarios)) : (d.mes_num===fin ? (d.contribuyentes===null?'n/d':fmtInt(d.contribuyentes)) : '—')}</td><td style="text-align:right">${d.monto===null?'n/d':fmt(d.monto,1)}</td></tr>`
    ).join('') || '<tr><td colspan="7" style="text-align:center;color:var(--grisclaro)">Sin resultados para este filtro.</td></tr>';
    f('detailCount').textContent=rows.length ? `Mostrando ${fmtInt((page-1)*PAGE_SIZE+1)}–${fmtInt(Math.min(page*PAGE_SIZE,rows.length))} de ${fmtInt(rows.length)} registros` : '0 registros';
    f('pageLabel').textContent=`Página ${page} de ${pageCount}`;
    f('prevPage').disabled=page<=1;
    f('nextPage').disabled=page>=pageCount;
  }
  f('prevPage').addEventListener('click', ()=>{page--;paint();});
  f('nextPage').addEventListener('click', ()=>{page++;paint();});
  paint();
}
</script>
</body>

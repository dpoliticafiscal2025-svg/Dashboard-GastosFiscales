<!DOCTYPE html>

<head>

<script>
  /* ============================================================
     CONFIGURACIÓN — edita solo esta parte para conectar tu Sheet
     ============================================================ */
  const CONFIG = {
    SHEET_ID: '1t44UD8juQencXipGs-aC7NocVlf3Sl_YTTytgXMzECQ',   // ID de tu Google Sheet
    SHEET_NAME: '01_BASE_GASTOS',        // nombre exacto de la pestaña
    UMBRAL_CAMBIO_MDP: 10                // a partir de cuántos mdp de variación un concepto se marca como relevante
  };
</script>
<style>
  :root{
    --guinda:#9D2148;
    --guinda-dark:#7A1938;
    --dorado:#B28E5C;
    --dorado-dark:#8F7147;
    --gris:#55585A;
    --crema:#FFFAE9;
    --grisclaro:#BFB7AF;
    --bg:#F7F6F3;
    --card:#FFFFFF;
    --border:#E6E1D8;
    --pos:#5B7A4E;
    --neg:#A6433C;
    --font: 'Roboto', Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--gris);font-family:var(--font);font-weight:400;}
  header{background:var(--guinda);color:#fff;padding:20px 32px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;border-bottom:4px solid var(--dorado);}
  header .brand{display:flex;flex-direction:column;}
  header h1{font-size:1.4rem;margin:0;font-weight:700;letter-spacing:.2px;}
  header .sub{font-size:.78rem;color:#F0D9C8;margin-top:3px;font-weight:300;}
  header .meta{text-align:right;font-size:.8rem;color:#F0D9C8;font-weight:300;}
  header .meta b{color:#fff;font-weight:700;}

  nav{background:var(--guinda-dark);display:flex;gap:2px;padding:0 24px;overflow-x:auto;}
  nav button{background:transparent;border:none;color:#EBC9CD;padding:13px 20px;font-size:.88rem;cursor:pointer;border-bottom:3px solid transparent;font-family:var(--font);white-space:nowrap;font-weight:500;}
  nav button.active{color:#fff;border-bottom-color:var(--dorado);font-weight:700;}
  nav button:hover{color:#fff;}

  main{max-width:1300px;margin:0 auto;padding:18px 24px 60px;}
  .view{display:none;}
  .view.active{display:block;animation:fade .2s ease;}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  /* ---------- barra de filtros globales ---------- */
  .filterbar{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 18px;margin-bottom:18px;
    display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end;border-top:3px solid var(--guinda);}
  .fb-group{display:flex;flex-direction:column;gap:4px;min-width:130px;}
  .fb-group label{font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--dorado-dark);font-weight:700;}
  .fb-note{font-size:.72rem;color:var(--neg);flex-basis:100%;}

  select, input[type=text]{padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:.83rem;font-family:var(--font);background:#fff;color:var(--gris);}

  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px;}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 18px;border-top:3px solid var(--dorado);}
  .kpi .label{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--grisclaro);margin-bottom:6px;font-weight:500;}
  .kpi .value{font-size:1.55rem;font-weight:700;color:var(--guinda);}
  .kpi .delta{font-size:.76rem;margin-top:4px;color:var(--grisclaro);}
  .kpi .delta.pos{color:var(--pos);font-weight:500;}
  .kpi .delta.neg{color:var(--neg);font-weight:500;}

  .grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:16px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
  @media(max-width:850px){.grid2,.grid3{grid-template-columns:1fr;}}

  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;}
  .card h3{margin:0 0 3px 0;font-size:1rem;color:var(--guinda);font-weight:700;}
  .card .cap{font-size:.74rem;color:var(--grisclaro);margin-bottom:12px;}

  table{width:100%;border-collapse:collapse;font-size:.82rem;}
  th{text-align:left;color:var(--grisclaro);font-weight:500;font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);padding:7px 8px;}
  td{padding:7px 8px;border-bottom:1px solid #F1EEE7;}
  tr:hover td{background:var(--crema);}
  .barcell{position:relative;display:inline-block;width:64px;height:19px;background:#F1EEE7;border-radius:3px;overflow:hidden;vertical-align:middle;}
  .barcell .fill{position:absolute;left:0;top:0;bottom:0;width:var(--pct,0%);background:var(--dorado);}
  .barcell .txt{position:relative;z-index:1;font-size:.72rem;color:var(--gris);font-weight:700;display:flex;align-items:center;justify-content:center;height:100%;}
  .napct{color:var(--grisclaro);font-style:italic;font-size:.78rem;}

  .tag{display:inline-block;padding:2px 9px;border-radius:10px;font-size:.68rem;font-weight:700;letter-spacing:.02em;}
  .tag.sub{background:#EFE3D3;color:var(--dorado-dark);}
  .tag.red{background:#DCE7D6;color:#3E5A32;}
  .tag.con{background:#F3D9E1;color:var(--guinda-dark);}
  .tag.exe{background:#E3DCEC;color:#5A4A7A;}

  .alert{padding:10px 12px;border-left:3px solid var(--dorado);background:var(--crema);margin-bottom:8px;border-radius:0 6px 6px 0;font-size:.85rem;}
  .alert.up{border-color:var(--pos);background:#EEF3EC;}
  .alert.down{border-color:var(--neg);background:#F7ECEA;}
  .alert.info{border-color:var(--guinda);background:#F7ECEF;}
  .alert b{color:var(--guinda);}

  /* ---------- sub-pestañas dentro de Análisis ---------- */
  .subtabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .subtabs button{background:#fff;border:1px solid var(--border);color:var(--gris);padding:8px 16px;border-radius:20px;font-size:.82rem;cursor:pointer;font-family:var(--font);font-weight:500;}
  .subtabs button.active{background:var(--guinda);border-color:var(--guinda);color:#fff;font-weight:700;}
  .subview{display:none;}
  .subview.active{display:block;}

  footer{text-align:center;padding:24px;color:var(--grisclaro);font-size:.75rem;}
  .note{font-size:.75rem;color:var(--grisclaro);margin-top:10px;font-style:italic;}
  .state-msg{padding:60px 20px;text-align:center;color:var(--grisclaro);}
  .state-msg.error{color:var(--neg);}
</style>

<body>

<header>
  <div class="brand">
    <h1>Gastos Fiscales · Ciudad de México</h1>
    <div class="sub">Sistema de seguimiento continuo — alimentado en vivo desde Google Sheets</div>
  </div>
  <div class="meta" id="headerMeta">Cargando…</div>
</header>

<nav id="nav"></nav>

<main id="main">
  <div class="state-msg" id="loadingMsg">Cargando información de la base…</div>
</main>

<footer>Fuente: Secretaría de Administración y Finanzas de la CDMX · Datos capturados en la base de Gastos Fiscales</footer>

<script>
// ============================================================
// 1. CARGA DE DATOS DESDE GOOGLE SHEETS (Google Visualization API)
// ============================================================
const COL = {ID:0, EJERCICIO:1, MES_NUM:2, MES:3, TIPO:4, CONCEPTO:5, ARTICULO:6, RANGO:7, AMBITO:8, BENEF:9, MONTO:10};

async function fetchSheetRows(sheetId, sheetName){
  const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('No se pudo leer la hoja (revisa que esté compartida como "Cualquier persona con el enlace - Lector").');
  const text = await res.text();
  const jsonStart = text.indexOf('{');
  const jsonEnd = text.lastIndexOf('}');
  const json = JSON.parse(text.substring(jsonStart, jsonEnd+1));
  const rawRows = json.table.rows;
  const data = [];
  rawRows.forEach(r=>{
    const c = r.c;
    const get = (i)=> c[i] ? c[i].v : null;
    const ejercicio = get(COL.EJERCICIO);
    const tipo = get(COL.TIPO);
    const concepto = get(COL.CONCEPTO);
    if(ejercicio === null || tipo === null || concepto === null) return;
    data.push({
      ejercicio: Math.round(ejercicio),
      mes_num: Math.round(get(COL.MES_NUM)),
      mes: get(COL.MES),
      tipo: String(tipo).trim(),
      concepto: String(concepto).trim(),
      articulo: get(COL.ARTICULO),
      rango: get(COL.RANGO),
      ambito: get(COL.AMBITO),
      beneficiarios: get(COL.BENEF) || 0,
      monto: get(COL.MONTO) || 0
    });
  });
  return data;
}

const MES_NOMBRE = ['','Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const MES_NOMBRE_LARGO = ['','Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const COLOR_TIPO = {Subsidios:'#B28E5C', Reducciones:'#5B7A4E', Condonaciones:'#9D2148', Exenciones:'#6B5A8C', Disminuciones:'#55585A'};
const TAG_CLASS = {Subsidios:'sub', Reducciones:'red', Condonaciones:'con', Exenciones:'exe', Disminuciones:'exe'};

let DATA = [];
let FILTERS = { year:null, periodo:'anual', mesIni:1, mesFin:12, tipo:'', concepto:'' };
let activeMainTab = 'v-resumen';
let activeSubTab = 'sub-evolucion';

(async function init(){
  try{
    if(CONFIG.SHEET_ID === 'PEGA_AQUI_TU_SHEET_ID'){
      showError('Falta configurar el ID de tu Google Sheet. Busca CONFIG.SHEET_ID en la parte superior del código y pega el ID de tu hoja.');
      return;
    }
    DATA = await fetchSheetRows(CONFIG.SHEET_ID, CONFIG.SHEET_NAME);
    if(DATA.length === 0){
      showError('La hoja se leyó correctamente pero no se encontraron filas con datos.');
      return;
    }
    // validaciones de calidad en segundo plano (no se muestran como sección, solo en consola)
    const conMontoVacio = DATA.filter(d=>!d.monto || d.monto===0).length;
    console.log(`[Calidad] Registros: ${DATA.length} · Con monto en 0/vacío: ${conMontoVacio}`);

    const years = [...new Set(DATA.map(d=>d.ejercicio))].sort();
    FILTERS.year = years[years.length-1];
    buildDashboard(years);
  }catch(err){
    showError(err.message || 'Ocurrió un error al leer la hoja de cálculo.');
  }
})();

function showError(msg){
  document.getElementById('main').innerHTML = `<div class="state-msg error"><strong>No se pudo cargar el dashboard.</strong><br><br>${msg}</div>`;
  document.getElementById('headerMeta').textContent = 'Sin conexión a datos';
}

function fmt(n, dec=1){ return (n||0).toLocaleString('es-MX',{minimumFractionDigits:dec, maximumFractionDigits:dec}); }
function fmtInt(n){ return Math.round(n||0).toLocaleString('es-MX'); }
function tagFor(tipo){ return `<span class="tag ${TAG_CLASS[tipo]||''}">${tipo}</span>`; }

// ============================================================
// 2. ARMADO GENERAL — nav de 3 secciones + barra de filtros globales
// ============================================================
function buildDashboard(years){
  const periodsWithData = [...new Set(DATA.filter(d=>d.monto>0).map(d=>`${d.ejercicio}-${String(d.mes_num).padStart(2,'0')}`))].sort();
  const lastPeriod = periodsWithData[periodsWithData.length-1];
  const [lastYear, lastMonthStr] = lastPeriod.split('-');
  document.getElementById('headerMeta').innerHTML = `Corte: <b>${MES_NOMBRE_LARGO[parseInt(lastMonthStr)]} ${lastYear}</b><br>${DATA.length.toLocaleString('es-MX')} registros en base`;

  // --- nav principal (3 secciones) ---
  const navViews = [['v-resumen','Resumen ejecutivo'], ['v-analisis','Análisis'], ['v-detalle','Detalle']];
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  navViews.forEach(([id,label])=>{
    const b = document.createElement('button');
    b.textContent = label;
    b.dataset.target = id;
    b.onclick = ()=>{
      document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
      document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      document.getElementById(id).classList.add('active');
      activeMainTab = id;
      document.getElementById('filterbar').style.display = (id==='v-detalle') ? 'none' : 'flex';
    };
    nav.appendChild(b);
  });

  // --- shell del main: barra de filtros + 3 secciones ---
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="filterbar" id="filterbar"></div>
    <section class="view" id="v-resumen"></section>
    <section class="view" id="v-analisis"></section>
    <section class="view" id="v-detalle"></section>
  `;

  renderFilterBar(years);
  renderDetalle(); // Detalle: filtros propios, no cambia con FILTERS globales

  refreshFilteredViews();

  nav.querySelector('button').click(); // activa "Resumen ejecutivo" por defecto
}

// ============================================================
// 3. BARRA DE FILTROS GLOBALES (afecta Resumen + Análisis)
// ============================================================
function renderFilterBar(years){
  const tipos = [...new Set(DATA.map(d=>d.tipo))].sort();
  const conceptos = [...new Set(DATA.map(d=>d.concepto))].sort();
  const fb = document.getElementById('filterbar');
  fb.innerHTML = `
    <div class="fb-group">
      <label>Ejercicio</label>
      <select id="gfYear">${years.map(y=>`<option value="${y}" ${y===FILTERS.year?'selected':''}>${y}</option>`).join('')}</select>
    </div>
    <div class="fb-group">
      <label>Periodo</label>
      <select id="gfPeriodo">
        <option value="anual">Anual</option>
        <option value="mensual">Mensual</option>
        <option value="rango">Rango de meses</option>
      </select>
    </div>
    <div class="fb-group" id="fbMesIniWrap">
      <label id="lblMesIni">Mes inicial</label>
      <select id="gfMesIni">${MES_NOMBRE_LARGO.slice(1).map((m,i)=>`<option value="${i+1}">${m}</option>`).join('')}</select>
    </div>
    <div class="fb-group" id="fbMesFinWrap">
      <label>Mes final</label>
      <select id="gfMesFin">${MES_NOMBRE_LARGO.slice(1).map((m,i)=>`<option value="${i+1}">${m}</option>`).join('')}</select>
    </div>
    <div class="fb-group">
      <label>Tipo de beneficio</label>
      <select id="gfTipo"><option value="">Todos</option>${tipos.map(t=>`<option value="${t}">${t}</option>`).join('')}</select>
    </div>
    <div class="fb-group">
      <label>Concepto</label>
      <select id="gfConcepto"><option value="">Todos</option>${conceptos.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
    </div>
    <div class="fb-note" id="fbNote"></div>
  `;
  document.getElementById('gfMesFin').value = 12;
  applyPeriodoVisibility();

  document.getElementById('gfYear').addEventListener('change', e=>{ FILTERS.year=parseInt(e.target.value); refreshFilteredViews(); });
  document.getElementById('gfPeriodo').addEventListener('change', e=>{
    FILTERS.periodo = e.target.value;
    if(FILTERS.periodo==='anual'){ FILTERS.mesIni=1; FILTERS.mesFin=12; }
    if(FILTERS.periodo==='mensual'){ FILTERS.mesFin = FILTERS.mesIni; document.getElementById('gfMesFin').value = FILTERS.mesIni; }
    applyPeriodoVisibility();
    refreshFilteredViews();
  });
  document.getElementById('gfMesIni').addEventListener('change', e=>{
    FILTERS.mesIni = parseInt(e.target.value);
    if(FILTERS.periodo==='mensual'){ FILTERS.mesFin = FILTERS.mesIni; document.getElementById('gfMesFin').value = FILTERS.mesIni; }
    if(FILTERS.mesFin < FILTERS.mesIni){ FILTERS.mesFin = FILTERS.mesIni; document.getElementById('gfMesFin').value = FILTERS.mesIni; }
    refreshFilteredViews();
  });
  document.getElementById('gfMesFin').addEventListener('change', e=>{
    let v = parseInt(e.target.value);
    if(v < FILTERS.mesIni){
      document.getElementById('fbNote').textContent = 'El mes final no puede ser anterior al mes inicial — se ajustó automáticamente.';
      v = FILTERS.mesIni;
      e.target.value = v;
    } else {
      document.getElementById('fbNote').textContent = '';
    }
    FILTERS.mesFin = v;
    refreshFilteredViews();
  });
  document.getElementById('gfTipo').addEventListener('change', e=>{ FILTERS.tipo=e.target.value; refreshFilteredViews(); });
  document.getElementById('gfConcepto').addEventListener('change', e=>{ FILTERS.concepto=e.target.value; refreshFilteredViews(); });
}

function applyPeriodoVisibility(){
  const iniWrap = document.getElementById('fbMesIniWrap');
  const finWrap = document.getElementById('fbMesFinWrap');
  const lbl = document.getElementById('lblMesIni');
  if(FILTERS.periodo==='anual'){
    iniWrap.style.display='none'; finWrap.style.display='none';
  } else if(FILTERS.periodo==='mensual'){
    iniWrap.style.display='flex'; finWrap.style.display='none';
    lbl.textContent='Mes';
    document.getElementById('gfMesIni').value = FILTERS.mesIni;
  } else {
    iniWrap.style.display='flex'; finWrap.style.display='flex';
    lbl.textContent='Mes inicial';
    document.getElementById('gfMesIni').value = FILTERS.mesIni;
    document.getElementById('gfMesFin').value = FILTERS.mesFin;
  }
}

// ============================================================
// 4. HELPERS DE AGREGACIÓN SOBRE FILTROS
// ============================================================
function monthsInRange(mesIni, mesFin){
  const out=[]; for(let m=mesIni;m<=mesFin;m++) out.push(m); return out;
}
function getRows(year, mesIni, mesFin, tipo, concepto){
  return DATA.filter(d=> d.ejercicio===year && d.mes_num>=mesIni && d.mes_num<=mesFin
    && (!tipo || d.tipo===tipo) && (!concepto || d.concepto===concepto));
}
function getFilteredRows(){
  return getRows(FILTERS.year, FILTERS.mesIni, FILTERS.mesFin, FILTERS.tipo, FILTERS.concepto);
}
function getPrevYearRows(){
  return getRows(FILTERS.year-1, FILTERS.mesIni, FILTERS.mesFin, FILTERS.tipo, FILTERS.concepto);
}
function sumBy(rows, keyFn){
  const m = new Map();
  rows.forEach(r=>{ const k=keyFn(r); m.set(k,(m.get(k)||0)+r.monto); });
  return m;
}
function periodoLabel(){
  if(FILTERS.periodo==='anual') return `Año completo ${FILTERS.year}`;
  if(FILTERS.periodo==='mensual') return `${MES_NOMBRE_LARGO[FILTERS.mesIni]} ${FILTERS.year}`;
  return `${MES_NOMBRE_LARGO[FILTERS.mesIni]}–${MES_NOMBRE_LARGO[FILTERS.mesFin]} ${FILTERS.year}`;
}
function periodoLabelPrev(){
  if(FILTERS.periodo==='anual') return `Año completo ${FILTERS.year-1}`;
  if(FILTERS.periodo==='mensual') return `${MES_NOMBRE_LARGO[FILTERS.mesIni]} ${FILTERS.year-1}`;
  return `${MES_NOMBRE_LARGO[FILTERS.mesIni]}–${MES_NOMBRE_LARGO[FILTERS.mesFin]} ${FILTERS.year-1}`;
}

// ============================================================
// 5. REFRESCO — se llama cada vez que cambia un filtro global
// ============================================================
function refreshFilteredViews(){
  renderResumen();
  renderAnalisis();
}

// ---------- CAMBIOS (cálculo compartido entre Resumen y Análisis) ----------
function calcularCambiosPeriodo(){
  const curRows = getFilteredRows();
  const prevRows = getPrevYearRows();
  const curMap = sumBy(curRows, r=>r.tipo+' · '+r.concepto);
  const prevMap = sumBy(prevRows, r=>r.tipo+' · '+r.concepto);
  const keys = new Set([...curMap.keys(), ...prevMap.keys()]);
  const variaciones=[], nuevos=[], desaparecidos=[];
  keys.forEach(k=>{
    const curVal = curMap.get(k)||0;
    const prevVal = prevMap.get(k)||0;
    const delta = curVal-prevVal;
    if(prevVal===0 && curVal>0){ nuevos.push({concepto:k, curVal}); return; }
    if(prevVal>0 && curVal===0){ desaparecidos.push({concepto:k, prevVal}); return; }
    if(Math.abs(delta) >= CONFIG.UMBRAL_CAMBIO_MDP){ variaciones.push({concepto:k, curVal, prevVal, delta}); }
  });
  variaciones.sort((a,b)=> Math.abs(b.delta)-Math.abs(a.delta));
  return {variaciones, nuevos, desaparecidos};
}

// ============================================================
// 6. SECCIÓN 1 — RESUMEN EJECUTIVO
// ============================================================
function renderResumen(){
  const rows = getFilteredRows();
  const prevRows = getPrevYearRows();
  const acumulado = rows.reduce((s,r)=>s+r.monto,0);
  const acumuladoPrev = prevRows.reduce((s,r)=>s+r.monto,0);
  const beneficiarios = rows.reduce((s,r)=>s+r.beneficiarios,0);
  const deltaInteranual = acumuladoPrev>0 ? (acumulado-acumuladoPrev)/acumuladoPrev : null;

  const porConcepto = sumBy(rows, r=>r.tipo+' · '+r.concepto);
  const top1 = [...porConcepto.entries()].sort((a,b)=>b[1]-a[1])[0];
  const concentracion = (top1 && acumulado>0) ? top1[1]/acumulado : null;

  const meses = monthsInRange(FILTERS.mesIni, FILTERS.mesFin);
  const tiposPresentes = [...new Set(rows.map(d=>d.tipo))];
  const monthlyByTipo = {};
  tiposPresentes.forEach(t=> monthlyByTipo[t] = meses.map(()=>0));
  rows.forEach(d=>{ const idx = meses.indexOf(d.mes_num); if(idx>=0) monthlyByTipo[d.tipo][idx]+=d.monto; });

  const {variaciones, nuevos, desaparecidos} = calcularCambiosPeriodo();

  const el = document.getElementById('v-resumen');
  el.innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="label">Gasto fiscal — ${periodoLabel()}</div><div class="value">${fmt(acumulado)} mdp</div><div class="delta">${fmtInt(rows.length)} registros</div></div>
      <div class="kpi"><div class="label">Variación interanual</div><div class="value">${deltaInteranual!==null ? (deltaInteranual>=0?'+':'')+fmt(deltaInteranual*100)+'%' : 'n/d'}</div><div class="delta ${deltaInteranual>=0?'pos':'neg'}">vs. ${periodoLabelPrev()}</div></div>
      <div class="kpi"><div class="label">Beneficiarios</div><div class="value">${fmtInt(beneficiarios)}</div><div class="delta">${periodoLabel()}</div></div>
      <div class="kpi"><div class="label">Concentración Top 1</div><div class="value">${concentracion!==null ? fmt(concentracion*100)+'%' : 'n/d'}</div><div class="delta">${top1?top1[0]:'—'}</div></div>
    </div>
    <div class="grid2">
      <div class="card">
        <h3>Evolución general</h3>
        <div class="cap">Millones de pesos · ${periodoLabel()}</div>
        <canvas id="chartResumen" height="150"></canvas>
      </div>
      <div class="card">
        <h3>Cambios y puntos de atención</h3>
        <div class="cap">${periodoLabel()} vs. ${periodoLabelPrev()} — calculado automáticamente</div>
        <div id="alertasResumen"></div>
      </div>
    </div>
  `;

  if(meses.length>1 && tiposPresentes.length>0){
    new Chart(document.getElementById('chartResumen'), {
      type:'line',
      data:{ labels: meses.map(m=>MES_NOMBRE[m]), datasets: tiposPresentes.map(t=>({
        label:t, data: monthlyByTipo[t], borderColor: COLOR_TIPO[t]||'#999', backgroundColor:(COLOR_TIPO[t]||'#999')+'22',
        tension:.25, fill:false, pointRadius:3
      }))},
      options:{ plugins:{legend:{position:'bottom', labels:{boxWidth:10,font:{size:11,family:'Roboto'}}}},
        scales:{ y:{ ticks:{ callback:v=>v.toLocaleString('es-MX') } }, x:{ grid:{display:false} } } }
    });
  } else {
    const totalPorTipo = {};
    tiposPresentes.forEach(t=> totalPorTipo[t] = monthlyByTipo[t].reduce((a,b)=>a+b,0));
    new Chart(document.getElementById('chartResumen'), {
      type:'doughnut',
      data:{ labels:Object.keys(totalPorTipo), datasets:[{ data:Object.values(totalPorTipo).map(v=>+v.toFixed(1)), backgroundColor:Object.keys(totalPorTipo).map(t=>COLOR_TIPO[t]) }]},
      options:{ plugins:{ legend:{position:'bottom', labels:{boxWidth:10,font:{size:11,family:'Roboto'}}} } }
    });
  }

  const alEl = document.getElementById('alertasResumen');
  let html = '';
  if(concentracion!==null && concentracion>0.5){
    html += `<div class="alert info"><b>Concentración alta:</b> ${top1[0]} representa ${fmt(concentracion*100)}% del gasto fiscal del periodo.</div>`;
  }
  variaciones.slice(0,4).forEach(c=>{
    const cls = c.delta>=0 ? 'up' : 'down';
    const arrow = c.delta>=0 ? '▲' : '▼';
    const pctTxt = c.prevVal>0 ? ` (${(c.delta/c.prevVal*100).toFixed(0)}%)` : '';
    html += `<div class="alert ${cls}"><b>${c.concepto}:</b> ${arrow} ${fmt(Math.abs(c.delta))} mdp${pctTxt} vs. mismo periodo anterior.</div>`;
  });
  if(nuevos.length>0){
    html += `<div class="alert up"><b>Conceptos nuevos:</b> ${nuevos.map(n=>n.concepto).join(', ')}.</div>`;
  }
  if(desaparecidos.length>0){
    html += `<div class="alert down"><b>Sin movimiento este periodo (tenían monto antes):</b> ${desaparecidos.map(n=>n.concepto).join(', ')}.</div>`;
  }
  if(html==='') html = '<div class="alert">Sin variaciones relevantes por encima del umbral configurado para este periodo.</div>';
  alEl.innerHTML = html;
}

// ============================================================
// 7. SECCIÓN 2 — ANÁLISIS (Evolución / Distribución / Tops en subtabs)
// ============================================================
function renderAnalisis(){
  const el = document.getElementById('v-analisis');
  const isFirstRender = !el.querySelector('.subtabs');
  if(isFirstRender){
    el.innerHTML = `
      <div class="subtabs">
        <button data-sub="sub-evolucion" class="active">Evolución</button>
        <button data-sub="sub-distribucion">Distribución</button>
        <button data-sub="sub-tops">Tops</button>
      </div>
      <div class="subview active" id="sub-evolucion"></div>
      <div class="subview" id="sub-distribucion"></div>
      <div class="subview" id="sub-tops"></div>
    `;
    el.querySelectorAll('.subtabs button').forEach(b=>{
      b.onclick = ()=>{
        el.querySelectorAll('.subtabs button').forEach(x=>x.classList.remove('active'));
        el.querySelectorAll('.subview').forEach(x=>x.classList.remove('active'));
        b.classList.add('active');
        document.getElementById(b.dataset.sub).classList.add('active');
        activeSubTab = b.dataset.sub;
      };
    });
  }
  paintEvolucionAnalisis();
  paintDistribucion();
  paintTopsAnalisis();
}

function paintEvolucionAnalisis(){
  const rows = getFilteredRows();
  const prevRows = getPrevYearRows();
  const meses = monthsInRange(FILTERS.mesIni, FILTERS.mesFin);
  const tipos = [...new Set([...rows, ...prevRows].map(d=>d.tipo))];

  const monthlyCur = {}; tipos.forEach(t=> monthlyCur[t]=meses.map(()=>0));
  rows.forEach(d=>{ const idx=meses.indexOf(d.mes_num); if(idx>=0) monthlyCur[d.tipo][idx]+=d.monto; });

  const totalCurByMonth = meses.map((_,i)=> tipos.reduce((s,t)=>s+monthlyCur[t][i],0));
  const totalPrevByMonth = meses.map(m=> prevRows.filter(d=>d.mes_num===m).reduce((s,r)=>s+r.monto,0));

  let accC=0, accP=0;
  const acumCur = totalCurByMonth.map(v=>{accC+=v; return +accC.toFixed(2);});
  const acumPrev = totalPrevByMonth.map(v=>{accP+=v; return +accP.toFixed(2);});

  const totalCur = totalCurByMonth.reduce((a,b)=>a+b,0);
  const totalPrev = totalPrevByMonth.reduce((a,b)=>a+b,0);

  const target = document.getElementById('sub-evolucion');
  target.innerHTML = `
    <div class="card" style="margin-bottom:16px;">
      <h3>Evolución mensual por tipo de beneficio</h3>
      <div class="cap">Millones de pesos · ${periodoLabel()}</div>
      <canvas id="chartEvolLine" height="110"></canvas>
    </div>
    <div class="grid2">
      <div class="card">
        <h3>Acumulado progresivo — comparación interanual</h3>
        <div class="cap">${periodoLabel()} vs. ${periodoLabelPrev()}, mismo corte temporal</div>
        <canvas id="chartAcumulado" height="150"></canvas>
      </div>
      <div class="card">
        <h3>Total del periodo — comparación</h3>
        <div class="cap">${periodoLabel()} vs. ${periodoLabelPrev()}</div>
        <canvas id="chartVsAnterior" height="150"></canvas>
        <p class="note">${totalPrev===0 ? 'No hay datos del periodo equivalente en el año anterior para comparar.' : ''}</p>
      </div>
    </div>
  `;

  if(window._chEvol) window._chEvol.destroy();
  window._chEvol = new Chart(document.getElementById('chartEvolLine'), {
    type:'bar',
    data:{ labels: meses.map(m=>MES_NOMBRE[m]), datasets: tipos.map(t=>({label:t, data:monthlyCur[t], backgroundColor:COLOR_TIPO[t]})) },
    options:{ plugins:{legend:{position:'bottom',labels:{font:{family:'Roboto'}}}}, scales:{ x:{stacked:true, grid:{display:false}}, y:{stacked:true} } }
  });

  if(window._chAcum) window._chAcum.destroy();
  window._chAcum = new Chart(document.getElementById('chartAcumulado'), {
    type:'line',
    data:{ labels: meses.map(m=>MES_NOMBRE[m]), datasets:[
      { label:`${FILTERS.year}`, data:acumCur, borderColor:'#9D2148', backgroundColor:'#9D214822', fill:true, tension:.2 },
      { label:`${FILTERS.year-1}`, data:acumPrev, borderColor:'#BFB7AF', backgroundColor:'#BFB7AF22', fill:true, tension:.2, borderDash:[5,3] }
    ]},
    options:{ plugins:{legend:{position:'bottom',labels:{font:{family:'Roboto'}}}}, scales:{x:{grid:{display:false}}} }
  });

  if(window._chVs) window._chVs.destroy();
  window._chVs = new Chart(document.getElementById('chartVsAnterior'), {
    type:'bar',
    data:{ labels:[`${FILTERS.year-1}`,`${FILTERS.year}`], datasets:[{ data:[+totalPrev.toFixed(1), +totalCur.toFixed(1)], backgroundColor:['#BFB7AF','#9D2148'] }]},
    options:{ indexAxis:'y', plugins:{legend:{display:false}} }
  });
}

function paintDistribucion(){
  const rows = getFilteredRows();
  const byTipo = sumBy(rows, r=>r.tipo);
  const byConcepto = sumBy(rows, r=>r.concepto);
  const topC = [...byConcepto.entries()].sort((a,b)=>b[1]-a[1]).slice(0,10);

  const target = document.getElementById('sub-distribucion');
  target.innerHTML = `
    <div class="grid2">
      <div class="card"><h3>Por tipo de beneficio</h3><div class="cap">Monto — ${periodoLabel()}</div><canvas id="chartDistTipo" height="160"></canvas></div>
      <div class="card"><h3>Por concepto (Top 10)</h3><div class="cap">Monto — ${periodoLabel()}</div><canvas id="chartDistConcepto" height="160"></canvas></div>
    </div>
  `;
  if(byTipo.size===0){
    target.innerHTML = `<div class="card"><p class="note">No hay datos para el periodo y filtros seleccionados.</p></div>`;
    return;
  }
  if(window._chDT) window._chDT.destroy();
  window._chDT = new Chart(document.getElementById('chartDistTipo'), {
    type:'bar',
    data:{ labels:[...byTipo.keys()], datasets:[{ data:[...byTipo.values()].map(v=>+v.toFixed(1)), backgroundColor:[...byTipo.keys()].map(t=>COLOR_TIPO[t]) }]},
    options:{ plugins:{legend:{display:false}} }
  });
  if(window._chDC) window._chDC.destroy();
  window._chDC = new Chart(document.getElementById('chartDistConcepto'), {
    type:'bar',
    data:{ labels:topC.map(d=>d[0]), datasets:[{ data:topC.map(d=>+d[1].toFixed(1)), backgroundColor:'#B28E5C' }]},
    options:{ indexAxis:'y', plugins:{legend:{display:false}} }
  });
}

function paintTopsAnalisis(){
  const rows = getFilteredRows();
  const total = rows.reduce((s,r)=>s+r.monto,0);
  const byKey = sumBy(rows, r=>r.tipo+'|'+r.concepto);
  const top10 = [...byKey.entries()].sort((a,b)=>b[1]-a[1]).slice(0,10);

  const target = document.getElementById('sub-tops');
  target.innerHTML = `
    <div class="card">
      <h3>Top 10 conceptos por monto</h3>
      <div class="cap">${periodoLabel()} · calculado en vivo sobre los filtros seleccionados</div>
      <table><thead><tr><th>#</th><th>Tipo</th><th>Concepto</th><th style="text-align:right">Monto (mdp)</th><th>Participación</th></tr></thead>
      <tbody>${top10.length ? top10.map(([k,v],i)=>{
        const [tipo,con] = k.split('|');
        const pct = total>0 ? (v/total*100) : null;
        const pctCell = pct!==null ? `<div class="barcell"><div class="fill" style="--pct:${pct}%;"></div><div class="txt">${pct.toFixed(1)}%</div></div>` : `<span class="napct">— no aplica</span>`;
        return `<tr><td>${i+1}</td><td>${tagFor(tipo)}</td><td>${con}</td><td style="text-align:right">${fmt(v)}</td><td>${pctCell}</td></tr>`;
      }).join('') : `<tr><td colspan="5" style="text-align:center;color:var(--grisclaro)">Sin datos para este periodo y filtros.</td></tr>`}</tbody></table>
    </div>
  `;
}

// ============================================================
// 8. SECCIÓN 3 — DETALLE (sin cambios respecto a la versión anterior)
// ============================================================
function renderDetalle(){
  const el = document.getElementById('v-detalle');
  const years = [...new Set(DATA.map(d=>d.ejercicio))].sort();
  const tipos = [...new Set(DATA.map(d=>d.tipo))].sort();
  el.innerHTML = `
    <div class="card">
      <div class="toolbar">
        <select id="fYear"><option value="">Todos los ejercicios</option>${years.map(y=>`<option value="${y}">${y}</option>`).join('')}</select>
        <select id="fMes"><option value="">Todos los meses</option>${MES_NOMBRE_LARGO.slice(1).map((m,i)=>`<option value="${i+1}">${m}</option>`).join('')}</select>
        <select id="fTipo"><option value="">Todos los tipos</option>${tipos.map(t=>`<option value="${t}">${t}</option>`).join('')}</select>
        <input type="text" id="fBuscar" placeholder="Buscar concepto…">
      </div>
      <table><thead><tr><th>Ejercicio</th><th>Mes</th><th>Tipo</th><th>Concepto</th><th style="text-align:right">Beneficiarios</th><th style="text-align:right">Monto (mdp)</th></tr></thead>
      <tbody id="tbDetalle"></tbody></table>
    </div>
  `;
  const f = id=>document.getElementById(id);
  function paint(){
    const y=f('fYear').value, m=f('fMes').value, t=f('fTipo').value, q=f('fBuscar').value.toLowerCase();
    const rows = DATA.filter(d=>
      (!y || d.ejercicio===parseInt(y)) &&
      (!m || d.mes_num===parseInt(m)) &&
      (!t || d.tipo===t) &&
      (!q || d.concepto.toLowerCase().includes(q))
    ).slice(0,500);
    f('tbDetalle').innerHTML = rows.map(d=>
      `<tr><td>${d.ejercicio}</td><td>${MES_NOMBRE[d.mes_num]}</td><td>${tagFor(d.tipo)}</td><td>${d.concepto}${d.articulo?` <span style="color:var(--grisclaro)">(art. ${d.articulo})</span>`:''}</td>
       <td style="text-align:right">${fmtInt(d.beneficiarios)}</td><td style="text-align:right">${fmt(d.monto,3)}</td></tr>`
    ).join('') || '<tr><td colspan="6" style="text-align:center;color:var(--grisclaro)">Sin resultados para este filtro.</td></tr>';
  }
  ['fYear','fMes','fTipo'].forEach(id=> f(id).addEventListener('change', paint));
  f('fBuscar').addEventListener('input', paint);
  paint();
}
</script>
